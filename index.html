<body>
<div id="app" class="app"><div id="shell" class="shell"></div></div>
<div id="toast" class="toast"></div>
<script>
'use strict';
// CLEAN EMPTY DATABASE — no demo/sample questions or fake progress.
// A fresh storage key prevents data from earlier test builds from leaking into this build.
const KEY='jee-tracker-clean-v1';
const seed={
 subjects:{
  Physics:{icon:'⚛',sets:0,questions:0,progress:0},
  Chemistry:{icon:'⚗',sets:0,questions:0,progress:0},
  Mathematics:{icon:'π',sets:0,questions:0,progress:0}
 },
 notebooks:{Physics:[],Chemistry:[],Mathematics:[]},
 sets:{},
 referenceBooks:[],
 settings:{glow:true,compact:false,animations:true,dailyTarget:30}
};
function load(){
 try{
  const raw=localStorage.getItem(KEY);
  if(!raw) return JSON.parse(JSON.stringify(seed));
  const saved=JSON.parse(raw)||{};
  return {
   subjects:{...seed.subjects,...(saved.subjects||{})},
   notebooks:{...seed.notebooks,...(saved.notebooks||{})},
   sets:{...(saved.sets||{})},
   referenceBooks:Array.isArray(saved.referenceBooks)?saved.referenceBooks.map(b=>{
    const out={...b};
    if(!Array.isArray(out.chapterList) && Number(out.chapters)>0) out.chapterList=Array.from({length:Number(out.chapters)},(_,i)=>({name:`Chapter ${i+1}`,done:i<(Number(out.done)||0)}));
    return out;
   }):[],
   settings:{...seed.settings,...(saved.settings||{})}
  };
 }catch(e){return JSON.parse(JSON.stringify(seed))}
}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
let data=load();
const state={screen:localStorage.getItem(KEY+'-started')?'home':'splash',subject:'Physics',notebook:null,setKey:null,question:1,tab:'questions',filter:'all',analysisView:'overview',search:'',referenceBook:null};
const $=s=>document.querySelector(s);
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('show'),1800)}
function go(screen,extra={}){Object.assign(state,extra,{screen});render();window.scrollTo({top:0,behavior:'instant'})}
function subjects(){return Object.keys(data.subjects)}
function subjectStats(s){
 const sets=Object.values(data.sets||{}).filter(x=>x.subject===s);
 const questions=sets.reduce((n,x)=>n+(Number(x.questions)||0),0);
 const solved=sets.reduce((n,x)=>n+(Number(x.solved)||0),0);
 const notebooks=new Set(sets.map(x=>x.notebook||'Ungrouped')).size;
 const progress=questions?Math.round(solved/questions*100):0;
 return {questions,solved,notebooks:sets.length?notebooks:0,progress};
}
function subjectCard(s){const x=data.subjects[s],m=subjectStats(s);return `<button class="card subject" data-action="subject" data-subject="${s}"><div class="subjectIcon">${x.icon}</div><div class="subjectText"><b>${s}</b><span>${m.notebooks} notebooks · ${m.questions} questions</span><div class="miniBar"><i style="width:${m.progress}%"></i></div></div><div class="subjectPct">${m.progress}% ›</div></button>`}
function bottom(active){return `<nav class="bottom">${[['home','⌂','Home'],['search','⌕','Search'],['tracker','⌁','Tracker'],['settings','⚙','Settings']].map(([id,ic,t])=>`<button class="navBtn ${active===id?'active':''}" data-action="nav" data-nav="${id}"><span>${ic}</span>${t}</button>`).join('')}</nav>`}
function render(){const shell=$('#shell');let html='';
 if(state.screen==='splash')html=splash();
 else if(state.screen==='home')html=home();
 else if(state.screen==='subject')html=subject();
 else if(state.screen==='notebook')html=notebook();
 else if(state.screen==='set')html=setScreen();
 else if(state.screen==='question')html=question();
 else if(state.screen==='analysis')html=analysis();
 else if(state.screen==='search')html=searchScreen();
 else if(state.screen==='settings')html=settings();
 else if(state.screen==='referenceBook')html=referenceBookScreen();
 shell.innerHTML=html;
 document.body.classList.toggle('compact',!!data.settings?.compact);document.querySelector('#app')?.classList.toggle('glowOff',data.settings?.glow===false);
 if(state.screen!=='splash')shell.insertAdjacentHTML('beforeend',bottom(state.screen==='subject'||state.screen==='notebook'||state.screen==='set'||state.screen==='question'||state.screen==='analysis'?'tracker':state.screen));
}
function splash(){return `<section class="screen splash"><div class="logo"><div class="flag"></div><div class="mount"></div></div><h1>JEE<br><span>Question</span> Tracker</h1><div class="tagline">Track&nbsp; · &nbsp;Revise&nbsp; · &nbsp;Crack It</div><button class="get" data-action="start">Get Started →</button><div class="micro">Better tracking. Higher goals.</div></section>`}
function header(title,sub='',back=''){return `<header class="topbar">${back?`<button class="back" data-action="back">←</button>`:''}<div class="grow"><div class="brand"><span class="brandMark" aria-hidden="true"><svg viewBox="0 0 32 28" width="20" height="18"><defs><linearGradient id="brandGrad" x1="2" y1="26" x2="30" y2="2" gradientUnits="userSpaceOnUse"><stop stop-color="#ff173f"/><stop offset=".48" stop-color="#ff4168"/><stop offset="1" stop-color="#4aa7ff"/></linearGradient></defs><path d="M2 25 11 10l5 7 5-12 9 20H2Z" fill="url(#brandGrad)" opacity=".95"/><path d="M21 4v10l8-4-8-3" fill="#ff4168"/><path d="M4 25h25" stroke="#8fc8ff" stroke-width="1.3" opacity=".7"/></svg></span><span style="color:inherit">JEE Question <em style="color:var(--red);font-style:normal">Tracker</em></span></div><div class="title">${esc(title)}</div>${sub?`<div class="sub">${esc(sub)}</div>`:''}</div></header>`}
function computedOverview(){
 const all=Object.values(data.sets||{});const total=all.reduce((n,x)=>n+(Number(x.questions)||0),0);const solved=all.reduce((n,x)=>n+(Number(x.solved)||0),0);
 const left=all.reduce((n,x)=>n+(x.q||[]).filter(q=>(Number(q.status)||0)===0).length,0);
 const redo=all.reduce((n,x)=>n+(x.q||[]).filter(q=>(Number(q.status)||0)===2).length,0);
 const difficult=all.reduce((n,x)=>n+(x.q||[]).filter(q=>(Number(q.status)||0)===3).length,0);
 return {all,total,solved,left,redo,difficult,pct:total?Math.round(solved/total*100):0};
}
function recentRows(limit=4){
 const rows=[];Object.entries(data.sets||{}).forEach(([key,x])=>(x.q||[]).forEach((q,i)=>{if(q&&q.lastViewed){rows.push({key,name:x.name,n:i+1,status:Number(q.status)||0,time:q.lastViewed})}}));
 return rows.sort((a,b)=>b.time-a.time).slice(0,limit);
}
function statusLabel(st){return st===1?'✓ Done':st===2?'↻ Redo':st===3?'◉ Difficult':'○ Left'}
function home(){
 const o=computedOverview();
 const notebookCount=Object.values(data.notebooks||{}).reduce((n,a)=>n+(a||[]).length,0);
 const setCount=o.all.length;
 const recent=recentRows(3);
 const viewedToday=Object.values(data.sets||{}).reduce((n,x)=>(n+(x.q||[]).filter(q=>q.lastViewed&&new Date(q.lastViewed).toDateString()===new Date().toDateString()).length),0); const solvedToday=Object.values(data.sets||{}).reduce((n,x)=>(n+(x.q||[]).filter(q=>q.doneAt&&new Date(q.doneAt).toDateString()===new Date().toDateString()).length),0);
 const redo=o.redo,difficult=o.difficult;
 return `<section class="screen">${header('')}
 <div class="homeHero"><div class="greeting"><div><div class="eyebrow">GOOD EVENING,</div><h1>Umair</h1><p>Small steps. Big results.</p><div class="heroSub">Your question tracker at a glance.</div></div><div class="ring" style="background:conic-gradient(var(--red) 0 ${o.pct}%,#17324d ${o.pct}% 100%)"><div><b>${o.pct}%</b><span>Overall<br>Progress</span></div></div></div></div>
 <div class="metrics"><div class="card metric"><b>${o.total}</b><span>Total Questions</span></div><div class="card metric"><b>${o.solved}</b><span>✓ Solved</span></div><div class="card metric"><b>${o.left}</b><span>◷ Remaining</span></div></div>
 <div class="card overviewCard"><div class="overviewTop"><b>Overall Progress</b><span>${o.pct}% complete</span></div><div class="overviewLine"><i style="width:${o.pct}%"></i></div><div class="overviewMeta"><span>${o.solved} solved</span><span>${Math.max(0,o.total-o.solved)} remaining</span></div></div>
 <div class="homeMiniGrid"><div class="card homeMini"><b>${notebookCount}</b><span>Notebooks</span></div><div class="card homeMini"><b>${setCount}</b><span>Question Sets</span></div></div>
 <div class="sectionHead"><b>Tracker Snapshot</b><span class="sub">Live from your data</span></div>
 <div class="metrics snapshotMetrics"><div class="card metric"><b style="color:var(--gold)">${redo}</b><span>↻ Redo</span></div><div class="card metric"><b style="color:var(--purple)">${difficult}</b><span>◉ Difficult</span></div><div class="card metric"><b style="color:#57b2ff">${viewedToday}</b><span>◷ Viewed today</span></div><div class="card metric"><b style="color:var(--green)">${solvedToday}</b><span>✓ Done today</span></div></div>
 <div class="sectionHead"><b>Subjects</b><button data-action="nav" data-nav="tracker">View all ›</button></div><div class="subjectsGrid">${subjects().map(subjectCard).join('')}</div>
 <div class="sectionHead"><b>Recent Activity</b>${recent.length?'<span class="sub">Latest selections</span>':''}</div>
 ${recent.length?`<div class="card recentCard">${recent.map(r=>`<button class="recentRow" data-action="open-recent" data-key="${esc(r.key)}" data-q="${r.n}"><div class="recentDot">Q${r.n}</div><div class="recentText"><b>${esc(r.name)}</b><span>Question ${r.n}</span></div><span class="recentState ${r.status===1?'done':r.status===2?'redo':r.status===3?'difficult':'left'}">${statusLabel(r.status)}</span></button>`).join('')}</div>`:`<div class="card emptyState"><b>No recent activity yet</b><span>Open a question to have it appear here.</span></div>`}
 </section>`
}

function subject(){
 const s=state.subject;const m=subjectStats(s);const books=(data.notebooks[s]||[]).map(b=>{const rows=Object.values(data.sets).filter(x=>x.subject===s&&x.notebook===b.name);return {...b,sets:rows.length,questions:rows.reduce((n,x)=>n+(Number(x.questions)||0),0),solved:rows.reduce((n,x)=>n+(Number(x.solved)||0),0)}});const ungroup=Object.entries(data.sets).filter(([,x])=>x.subject===s&&x.notebook==='Ungrouped');
 return `<section class="screen">${header(s,`${m.notebooks} notebooks · ${m.questions} questions`,'back')}
 <div class="subjectSummary"><div class="card miniStat"><b>${m.questions}</b><span>Questions</span></div><div class="card miniStat"><b>${m.solved}</b><span>Solved</span></div><div class="card miniStat"><b>${m.progress}%</b><span>Progress</span></div></div>

function setScreen(){const x=data.sets[state.setKey];if(!x)return notebook();const q=x.q||[];const counts={left:q.filter(v=>(Number(v.status)||0)===0).length,done:q.filter(v=>(Number(v.status)||0)===1).length,redo:q.filter(v=>(Number(v.status)||0)===2).length,difficult:q.filter(v=>(Number(v.status)||0)===3).length};const revision=q.filter(v=>v.revision===true).length;const p=x.questions?Math.round(counts.done/x.questions*100):0;return `<section class="screen">${header(x.name,`${x.questions} questions`,'back')}<div class="stats5">${[['TOTAL',x.questions],['SOLVED',counts.done],['REVISION',revision],['DIFFICULT',counts.difficult],['REMAINING',counts.left]].map(a=>`<div class="stat5"><b>${a[1]}</b><span>${a[0]}</span></div>`).join('')}</div><div class="progress"><i style="width:${p}%"></i></div><div class="progressLabel">${p}% complete <span style="float:right">${counts.left} left</span></div><div class="subTabs"><button class="tab ${state.tab==='questions'?'active':''}" data-action="tab" data-tab="questions">Questions</button><button class="tab ${state.tab==='analysis'?'active':''}" data-action="tab" data-tab="analysis">Analysis</button></div>${state.tab==='analysis'?analysisInner(x):questionsInner(x)}</section>`}

function analysisInner(x){
 const q=x.q||[];
 const counts={left:q.filter(v=>(Number(v.status)||0)===0).length,done:q.filter(v=>(Number(v.status)||0)===1).length,redo:q.filter(v=>(Number(v.status)||0)===2).length,difficult:q.filter(v=>(Number(v.status)||0)===3).length};
 const revision=q.filter(v=>v.revision===true).length;
 const p=x.questions?Math.round(counts.done/x.questions*100):0;
 const view=state.analysisView||'overview';
 const tools=[['overview','Overview'],['status','Status'],['topics','Topics']];
 let body='';
 if(view==='status'){
   body=`<div class="statusRows"><button data-action="filter" data-filter="left"><span>○ Left</span><b>${counts.left}</b></button><button data-action="filter" data-filter="done"><span>✓ Done</span><b>${counts.done}</b></button><button data-action="filter" data-filter="redo"><span>↻ Redo</span><b>${counts.redo}</b></button><button data-action="filter" data-filter="difficult"><span>◉ Difficult</span><b>${counts.difficult}</b></button></div>`;
 }else if(view==='topics'){
   const topics={};
   q.forEach(v=>(v.tags||[]).forEach(t=>{const name=String(t||'').trim();if(name&&!topics[name])topics[name]={total:0,done:0};if(name){topics[name].total++;if((Number(v.status)||0)===1)topics[name].done++;}}));
   const keys=Object.keys(topics);
   if(keys.length){
     body=`<div class="sectionHead"><b>Topic performance</b></div>${keys.map(t=>{const z=topics[t],v=z.total?Math.round(z.done/z.total*100):0;return `<div class="topic"><div class="topicTop"><span>${esc(t)}</span><span>${v}%</span></div><div class="topicBar"><i style="width:${v}%"></i></div></div>`}).join('')}`;
   }else{
     body=`<div class="topicEmpty"><b>No topic data yet</b>Add topic tags to questions to see real topic-wise performance here.</div>`;
   }
 }else{
   const recent=q.map((v,i)=>({v,i})).filter(o=>o.v.lastViewed).sort((a,b)=>b.v.lastViewed-a.v.lastViewed).slice(0,4);
   body=`<div class="analysisOverview"><div class="accuracy" style="--acc:${p*3.6}deg"><div><b>${p}%</b><span>Accuracy</span></div></div><div class="analysisSide"><b>Performance snapshot</b><p>${counts.done} solved out of ${x.questions}. ${counts.left} remain, ${counts.redo} marked redo and ${counts.difficult} marked difficult.</p></div></div><div class="sectionHead"><b>Progress</b><span class="sub">${p}% complete</span></div><div class="analysisProgress"><i style="width:${p}%"></i></div><div class="progressLabel">${counts.done} solved <span style="float:right">${counts.left} left</span></div>${recent.length?`<div class="activityTitle">Recent Activity</div><div class="card analysisActivity">${recent.map(o=>`<div class="recentRow"><div class="recentDot">Q${o.i+1}</div><div class="recentText"><b>Question ${o.i+1}</b><span>Recently opened</span></div><span class="recentState ${o.v.status===1?'done':o.v.status===2?'redo':o.v.status===3?'difficult':'left'}">${statusLabel(Number(o.v.status)||0)}</span></div>`).join('')}</div>`:''}`;
 }
 return `<div class="analysisCards"><div class="analysisCard done"><b>${counts.done}</b><span>✓ Done</span><small>Questions solved</small></div><div class="analysisCard left"><b>${counts.left}</b><span>↻ Left</span><small>Questions remaining</small></div><div class="analysisCard revision"><b>${revision}</b><span>▣ Revision</span><small>Marked for revision</small></div><div class="analysisCard difficult"><b>${counts.difficult}</b><span>◉ Difficult</span><small>Needs extra work</small></div></div><div class="analysisTools">${tools.map(([key,label])=>`<button class="analysisTool ${view===key?'active':''}" data-action="analysis-filter" data-analysis="${key}">${label}</button>`).join('')}</div>${body}`;
}

 if(a==='tab'){state.tab=b.dataset.tab;state.filter='all';render();return}
 if(a==='question'){state.question=Number(b.dataset.q)||1;const x=data.sets[state.setKey];const q=x?.q?.[state.question-1];if(q){q.lastViewed=Date.now();save();}go('question');return}
 if(a==='mark-status'){const x=data.sets[state.setKey];const q=x?.q?.[state.question-1];if(q){q.status=Number(b.dataset.status)||0;if(q.status===1)q.doneAt=Date.now();else delete q.doneAt;x.solved=x.q.filter(v=>(Number(v.status)||0)===1).length;x.difficult=x.q.filter(v=>(Number(v.status)||0)===3).length;x.revision=x.q.filter(v=>v.revision===true).length;save();render();toast(q.status===1?'Question marked done':q.status===3?'Marked difficult':q.status===2?'Marked redo':'Moved to left')}return}
 if(a==='open-recent'){const k=b.dataset.key;if(!data.sets[k])return;state.setKey=k;state.subject=data.sets[k].subject;state.question=Number(b.dataset.q)||1;const q=data.sets[k].q?.[state.question-1];if(q){q.lastViewed=Date.now();save();}go('question');return}
 if(a==='toggle-revision'){const x=data.sets[state.setKey];const q=x?.q?.[state.question-1];if(q){q.revision=!q.revision;x.revision=(x.q||[]).filter(v=>v.revision===true).length;save();render();toast(q.revision?'Added to revision':'Removed from revision')}return}
 if(a==='save-question-text'){const x=data.sets[state.setKey];const q=x?.q?.[state.question-1];const input=document.getElementById('questionTextEdit');if(!q||!input)return;q.text=input.value.trim();save();render();toast('Question saved');return}
 if(a==='clear-question-text'){const x=data.sets[state.setKey];const q=x?.q?.[state.question-1];if(!q)return;if(!confirm('Clear the question text from this slot?'))return;q.text='';save();render();toast('Question text cleared');return}
 if(a==='add-tag'){const x=data.sets[state.setKey];const q=x?.q?.[state.question-1];if(q){const raw=prompt('Topic tag (e.g. Organic, Calculus)');if(raw&&raw.trim()){q.tags=Array.from(new Set([...(q.tags||[]),raw.trim()]));save();render();toast('Topic added')}}return}
 if(a==='next'){state.question=Math.min((data.sets[state.setKey]?.questions||1),state.question+1);render();return}
 if(a==='prev'){state.question=Math.max(1,state.question-1);render();return}
 if(a==='option'){document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');return}
 if(a==='toggle-setting'){const k=b.dataset.setting;if(!data.settings)data.settings={...seed.settings};data.settings[k]=!data.settings[k];save();document.body.classList.toggle('compact',!!data.settings.compact);document.querySelector('#app')?.classList.toggle('glowOff',data.settings.glow===false);render();return}
 if(a==='daily-target'){const raw=prompt('Daily question target',String(data.settings?.dailyTarget||30));if(raw===null)return;const n=Math.floor(Number(raw));if(!Number.isFinite(n)||n<1||n>1000){toast('Enter a target from 1 to 1000');return;}data.settings.dailyTarget=n;save();render();toast('Daily target updated');return}
 if(a==='add-book'){const name=prompt('Reference book name (e.g. H.C. Verma Vol 1)');if(!name||!name.trim())return;const author=prompt('Author / publisher (optional)')||'';const subject=prompt('Subject (Physics / Chemistry / Mathematics / Other)','Physics')||'Other';const ch=Math.max(0,Math.floor(Number(prompt('How many chapters / units does it have?','20'))||0));const chapterList=Array.from({length:ch},(_,i)=>({name:`Chapter ${i+1}`,done:false}));data.referenceBooks.push({id:'rb'+Date.now(),name:name.trim(),author:author.trim(),subject:subject.trim(),chapters:ch,done:0,chapterList});save();render();toast('Reference book added — open it to track chapters');return}
 if(a==='open-book'){state.referenceBook=b.dataset.id;go('referenceBook');return}
 if(a==='edit-book-detail'){const book=refBooks().find(x=>x.id===state.referenceBook);if(!book)return;const name=prompt('Book name',book.name);if(name===null)return;const author=prompt('Author / publisher',book.author||'');if(author===null)return;book.name=name.trim()||book.name;book.author=author.trim();save();render();toast('Book details updated');return}
 if(a==='add-chapter'){const book=refBooks().find(x=>x.id===state.referenceBook);if(!book)return;const name=prompt('Chapter / unit name',`Chapter ${(book.chapterList||[]).length+1}`);if(!name||!name.trim())return;book.chapterList=Array.isArray(book.chapterList)?book.chapterList:[];book.chapterList.push({name:name.trim(),done:false});book.chapters=book.chapterList.length;book.done=book.chapterList.filter(c=>c.done).length;save();render();toast('Chapter added');return}
 if(a==='rename-chapter'){const book=refBooks().find(x=>x.id===state.referenceBook);const i=Number(b.dataset.index);const c=book?.chapterList?.[i];if(!c)return;const name=prompt('Rename chapter / unit',c.name||`Chapter ${i+1}`);if(name===null)return;if(!name.trim()){toast('Chapter name cannot be empty');return;}c.name=name.trim();save();render();toast('Chapter renamed');return}
 if(a==='delete-chapter'){const book=refBooks().find(x=>x.id===state.referenceBook);const i=Number(b.dataset.index);const c=book?.chapterList?.[i];if(!c)return;if(!confirm(`Delete "${c.name||`Chapter ${i+1}`}"?`))return;book.chapterList.splice(i,1);book.chapters=book.chapterList.length;book.done=book.chapterList.filter(v=>v.done).length;save();render();toast('Chapter deleted');return}
 if(a==='toggle-chapter'){const book=refBooks().find(x=>x.id===state.referenceBook);const i=Number(b.dataset.index);if(!book||!Array.isArray(book.chapterList)||!book.chapterList[i])return;book.chapterList[i].done=!book.chapterList[i].done;book.done=book.chapterList.filter(c=>c.done).length;book.chapters=book.chapterList.length;save();render();toast(book.chapterList[i].done?'Chapter completed':'Chapter reopened');return}
 if(a==='book-progress'){const book=refBooks().find(x=>x.id===state.referenceBook);if(!book)return;const done=prompt('How many chapters / units have you completed?',String(book.done||0));if(done===null)return;const n=Math.max(0,Math.min((book.chapterList||[]).length,Math.floor(Number(done)||0)));(book.chapterList||[]).forEach((c,i)=>c.done=i<n);book.done=n;save();render();toast('Book progress updated');return}
 if(a==='delete-book'){const id=b.dataset.id;const book=refBooks().find(x=>x.id===id);if(!book)return;if(!confirm(`Remove "${book.name}" from Reference Library?`))return;data.referenceBooks=data.referenceBooks.filter(x=>x.id!==id);save();render();toast('Reference book removed');return}
 if(a==='storage-details'){const si=storageInfo();const notebooks=Object.values(data.notebooks||{}).reduce((n,a)=>n+(a?.length||0),0);const sets=Object.keys(data.sets||{}).length;const refs=refBooks().length;alert(`Tracker Storage\n\n${si.kb.toFixed(1)} KB of JSON data stored locally\n\n${totalQuestionsLabel(data)}\n${notebooks} notebooks\n${sets} question sets\n${refs} reference books\n\nYour data stays on this device unless you export a backup.`);return}
 if(a==='reset-data'){if(!confirm('Reset ALL tracker data on this device? This cannot be undone unless you have a backup.'))return;data=JSON.parse(JSON.stringify(seed));save();state.subject='Physics';state.notebook=null;state.setKey=null;state.referenceBook=null;state.question=1;render();toast('Tracker reset');return}
 if(a==='quick-export'){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const link=document.createElement('a');link.href=u;link.download='jee-tracker-backup.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(u),500);toast('Backup downloaded');return}
 if(a==='quick-import'){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{const f=inp.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(v.sets||v.subjects||v.notebooks){data=Object.assign(data,v);save();render();toast('Backup imported')}else toast('Unsupported backup')}catch(e){toast('Invalid JSON')}};r.readAsText(f)};inp.click();return}
 if(a==='new-set'){const n=prompt('Set / chapter name');if(!n||!n.trim())return;const rawCount=prompt('Number of questions to create (e.g. 50, 100, 205)');if(rawCount===null)return;const count=Math.floor(Number(rawCount));if(!Number.isFinite(count)||count<1||count>5000){toast('Enter a number from 1 to 5000');return;}const book=(data.notebooks[state.subject]||[]).find(v=>v.id===state.notebook);const notebookName=book?book.name:'Ungrouped';const baseKey=`${state.subject}::${notebookName}::${n.trim()}`;let key=baseKey,idx=2;while(data.sets[key]){key=baseKey+' '+idx++;}const qs=Array.from({length:count},()=>({status:0,tags:[],time:0,mistake:'',notes:''}));data.sets[key]={subject:state.subject,notebook:notebookName,name:n.trim(),questions:count,solved:0,revision:0,difficult:0,q:qs};if(book){book.sets=(book.sets||0)+1;book.questions=(book.questions||0)+count;}save();state.setKey=key;state.question=1;state.tab='questions';go('set',{setKey:key,subject:state.subject,notebook:state.notebook});toast(count+' questions created');return}
 if(a==='new-notebook'){const n=prompt('New notebook name');if(!n)return;data.notebooks[state.subject]=data.notebooks[state.subject]||[];data.notebooks[state.subject].push({id:'n'+Date.now(),name:n.trim(),sets:0,questions:0});save();render();toast('Notebook created');return}
}
document.addEventListener('click',handle);
document.addEventListener('input',e=>{if(e.target.id==='subjectSearch'){state.search=e.target.value;const boxes=document.querySelectorAll('.book');boxes.forEach(x=>x.style.display=(x.textContent.toLowerCase().includes(state.search.toLowerCase())?'':'none'))}if(e.target.id==='globalSearch'){state.search=e.target.value;clearTimeout(window.searchTimer);window.searchTimer=setTimeout(render,180)}});
try { render(); } catch (err) {
  const shell=document.getElementById('shell');
  if (shell) shell.innerHTML='<section class=\"screen splash\"><div class=\"logo\"><div class=\"flag\"></div><div class=\"mount\"></div></div><h1>JEE<br><span>Question</span> Tracker</h1><div class=\"tagline\">Track · Revise · Crack It</div><button class=\"get\" data-action=\"start\">Get Started →</button><div class=\"micro\">Better tracking. Higher goals.</div></section>';
}
</script>
