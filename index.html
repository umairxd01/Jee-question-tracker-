*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden}button,input,select{font:inherit}button{cursor:pointer;color:inherit}.app{min-height:100vh;position:relative;background:radial-gradient(circle at 85% 10%,rgba(var(--beamA),.13),transparent 25%),radial-gradient(circle at 5% 55%,rgba(var(--beamB),.13),transparent 28%),linear-gradient(180deg,var(--nz0),var(--nz1) 52%,var(--nz0))}
.app:before,.app:after{content:"";position:fixed;pointer-events:none;z-index:0;width:55vw;height:180vh;background:linear-gradient(115deg,transparent 42%,rgba(var(--beamA),.08) 47%,rgba(var(--beamA),.25) 49%,transparent 53%);transform:rotate(7deg);top:-55vh;right:-18vw;opacity:var(--beamOpacity)}.app:after{transform:rotate(-18deg);opacity:calc(var(--beamOpacity) * .65);right:auto;left:-25vw;top:-65vh}
.shell{position:relative;z-index:1;width:100%;max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:92px}.screen{min-height:100vh;padding:18px 16px 28px}.hidden{display:none!important}
/* splash */
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px;position:relative;overflow:hidden}

.splash h1{font-size:38px;line-height:.98;margin:8px 0 4px;font-weight:900;letter-spacing:-1.8px}

.noMotion .splash>*{animation:none}

ck}.accuracy span{font-size:9px;color:var(--nz5)}.topic{margin:11px 0}.topicTop{display:flex;justify-content:space-between;font-size:9px;margin-bottom:5px}.topicBar{height:7px;border-radius:7px;background:var(--nz2);overflow:hidden}.topicBar i{display:block;height:100%;background:linear-gradient(90deg,#ff2448,#ffb83d,#16d6a0)}

/* ---- App Lock PIN pad (follows every theme through --acc1 / --nz*) ---- */
.pinWrap{display:flex;flex-direction:column;align-items:center;margin-top:6px;width:100%;max-width:292px}
.splash .pinWrap{animation:splashUp .5s cubic-bezier(.22,.9,.3,1) .16s both}
.pinBadge{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 13px;border-radius:99px;font-size:10.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--acc1);background:color-mix(in srgb,var(--acc1) 12%,transparent);border:1px solid color-mix(in srgb,var(--acc1) 34%,transparent)}
.pinDots{display:flex;gap:16px;margin:20px 0 10px;height:16px}
.pinDots i{width:13px;height:13px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--nz5) 38%,transparent);background:transparent;transition:background .14s,border-color .14s,box-shadow .14s,transform .14s}
.pinDots i.on{background:var(--acc1);border-color:var(--acc1);box-shadow:0 0 12px var(--acc1);transform:scale(1.12)}
.pinMsg{min-height:18px;font-size:12.5px;font-weight:600;letter-spacing:.2px;color:var(--nz4);transition:color .15s}
.pinMsg.err{color:#ff6b7d}.pinMsg.ok{color:#4be3a8}
.pinGrid{display:grid;grid-template-columns:repeat(3,72px);gap:13px 20px;margin-top:20px;justify-content:center}
.pinKey{width:72px;height:72px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--nz5);border:1px solid color-mix(in srgb,var(--nz5) 14%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--nz5) 11%,transparent),color-mix(in srgb,var(--nz5) 3%,transparent));-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--nz5) 16%,transparent),0 8px 20px -10px rgba(0,0,0,.6);-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .09s,background .12s,border-color .12s,box-shadow .12s}
.pinKey b{font-size:27px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.pinKey span{display:block;font-size:8px;font-weight:700;letter-spacing:2px;color:var(--nz4);height:9px;line-height:9px;padding-left:2px}
.pinKey:active{transform:scale(.9);background:color-mix(in srgb,var(--acc1) 30%,transparent);border-color:var(--acc1);box-shadow:0 0 22px color-mix(in srgb,var(--acc1) 45%,transparent)}
.pinText{background:transparent;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;font-size:13px;font-weight:700;color:var(--nz4)}
.pinText:active{background:color-mix(in srgb,var(--nz5) 10%,transparent);border-color:transparent;box-shadow:none}
.pinGhost{visibility:hidden;pointer-events:none}
.pinWrap.shake .pinDots{animation:pinShake .5s cubic-bezier(.36,.07,.19,.97)}
.pinWrap.shake .pinDots i{border-color:#ff6b7d;background:#ff6b7d;box-shadow:0 0 12px #ff6b7d}
.pinWrap.ok .pinDots i{border-color:#4be3a8;background:#4be3a8;box-shadow:0 0 14px #4be3a8}
@keyframes pinShake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
.noMotion .pinWrap.shake .pinDots{animation:none}
.splash.locked .logo{width:128px;height:128px;margin-bottom:8px}
.splash.locked h1{font-size:32px}
.splash.locked .tagline{margin-bottom:6px}
.splash.locked{padding-bottom:64px}
@media (max-height:700px){.splash.locked .logo{width:96px;height:96px}.pinKey{width:64px;height:64px}.pinGrid{grid-template-columns:repeat(3,64px);gap:10px 18px;margin-top:14px}.pinDots{margin:14px 0 8px}.splash.locked h1{font-size:28px}.pinKey b{font-size:24px}}
.pinOverlay{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:pinFade .2s ease}
.pinCard{width:min(340px,100%);padding:24px 18px 22px;border-radius:26px;display:flex;flex-direction:column;align-items:center;background:linear-gradient(160deg,rgba(var(--bgRgb2),.98),rgba(var(--bgRgb),.99));border:1px solid color-mix(in srgb,var(--acc1) 30%,transparent);box-shadow:0 30px 70px -10px rgba(0,0,0,.7),0 0 40px -12px var(--acc1)}

@keyframes pinFade{from{opacity:0}to{opacity:1}}

/* ---- refined welcome screen ---- */
.splash:after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(110% 46% at 50% 112%,rgba(var(--beamA),.26),transparent 62%),radial-gradient(90% 40% at 50% -8%,rgba(var(--beamB),.14),transparent 70%),linear-gradient(180deg,transparent 55%,rgba(0,0,0,.30))}

<script>
'use strict';
// CLEAN EMPTY DATABASE — no demo/sample questions or fake progress.
// A fresh storage key prevents data from earlier test builds from leaking into this build.
const KEY='jee-tracker-clean-v1';
const seed={
 subjects:{
  Physics:{icon:'⚛',accent:'#378ADD',sets:0,questions:0,progress:0},
  Chemistry:{icon:'⚗',accent:'#D85A30',sets:0,questions:0,progress:0},
  Mathematics:{icon:'π',accent:'#7F77DD',sets:0,questions:0,progress:0}
 },

 sets:{},
 referenceBooks:[],
 settings:{glow:true,compact:false,animations:true,resetHour:3,dailyTarget:30,theme:'midnight-crimson',liquid:false,haptics:true},

};
function load(){
 try{
  const raw=localStorage.getItem(KEY);
  if(!raw) return JSON.parse(JSON.stringify(seed));
  const saved=JSON.parse(raw)||{};
  return {
   subjects:{...seed.subjects,...(saved.subjects||{})},
   notebooks:{...seed.notebooks,...(saved.notebooks||{})},
   sets:{...(saved.sets||{})},
   referenceBooks:Array.isArray(saved.referenceBooks)?saved.referenceBooks.map(b=>{
    const out={...b};
    if(!Array.isArray(out.chapterList) && Number(out.chapters)>0) out.chapterList=Array.from({length:Number(out.chapters)},(_,i)=>({name:`Chapter ${i+1}`,done:i<(Number(out.done)||0)}));
    return out;
   }):[],
   settings:{...seed.settings,...(saved.settings||{})},
   myDay:{day:(saved.myDay&&saved.myDay.day)||'',items:Array.isArray(saved.myDay&&saved.myDay.items)?saved.myDay.items:[],pastDue:Array.isArray(saved.myDay&&saved.myDay.pastDue)?saved.myDay.pastDue:[],todos:Array.isArray(saved.myDay&&saved.myDay.todos)?saved.myDay.todos:[],rem:(saved.myDay&&saved.myDay.rem)||{on:false,time:'20:00',shown:''},last:(saved.myDay&&saved.myDay.last&&saved.myDay.last.text)?saved.myDay.last:undefined,tdCleared:Number(saved.myDay&&saved.myDay.tdCleared)||0}
  };
 }catch(e){try{const bad=localStorage.getItem(KEY);if(bad)localStorage.setItem(KEY+'-rescue',bad)}catch(_){}return JSON.parse(JSON.stringify(seed))}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('⚠ Could not save (storage full/blocked). Export a backup now!')}try{window.syncTouch&&window.syncTouch()}catch(_){}}
function snap(){try{localStorage.setItem(KEY+'-prev',JSON.stringify(data))}catch(_){}}
function recount(x){x.solved=x.q.filter(v=>(Number(v.status)||0)===1).length;x.difficult=x.q.filter(v=>(Number(v.status)||0)===3).length;x.revision=x.q.filter(v=>v.revision===true).length}
let data=load();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
const state={screen:'splash',subject:'Physics',notebook:null,setKey:null,question:1,tab:'questions',filter:'all',analysisView:'overview',search:'',referenceBook:null};
state.locked=!!(data.settings&&data.settings.appLock);
const LA_KEY='jee-last-active',SPLASH_COOLDOWN=60000;
function markActive(){try{localStorage.setItem(LA_KEY,String(Date.now()))}catch(_){}}
function awayMs(){try{const t=Number(localStorage.getItem(LA_KEY));return t?Date.now()-t:Infinity}catch(_){return Infinity}}
if(awayMs()<SPLASH_COOLDOWN)state.screen='home';
markActive();setInterval(()=>{if(document.visibilityState==='visible')markActive()},15000);
const $=s=>document.querySelector(s);
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
/* ---- Haptics: Android/Chrome via navigator.vibrate; iOS 17.4+ Safari via hidden <input switch> tick ---- */
const HAP={tick:[18],light:[30],medium:[45],heavy:[80],success:[35,50,60],warn:[50,45,50],error:[65,45,65,45,65]};
let _hsw;
function hapSwitch(){if(_hsw!==undefined)return _hsw;try{const l=document.createElement('label');l.setAttribute('aria-hidden','true');l.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;z-index:-1';const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');i.tabIndex=-1;l.appendChild(i);document.body.appendChild(l);_hsw=l}catch(_){_hsw=null}return _hsw}
function haptic(kind){try{if(data&&data.settings&&data.settings.haptics===false)return;const p=HAP[kind]||HAP.light;if(navigator.vibrate){navigator.vibrate(p);return}const l=hapSwitch();if(!l)return;let t=0;p.forEach((v,i)=>{if(i%2===0){if(t===0)l.click();else setTimeout(()=>l.click(),t)}t+=v})}catch(_){}}
const HAP_MAP={'logo-burst':'success','preview-splash':'light',start:'medium',nav:'tick',subject:'light',notebook:'light','open-set':'light','open-recent':'light','open-book':'light',question:'tick',tab:'tick',filter:'tick','analysis-filter':'tick',next:'tick',prev:'tick',back:'tick',option:'tick','toggle-setting':'medium','toggle-applock':'medium','rep-toggle':'medium','card-open':'medium','card-share':'medium','rep-now':'medium','rep-send':'medium','change-pin':'medium','lock-now':'medium','pin-key':'tick','set-theme':'medium','rem-toggle':'medium','td-toggle':'light','toggle-chapter':'light','toggle-revision':'light','myday-inc':'light','myday-dec':'light','myday-rebase':'light','share-progress':'light','myday-del':'warn','td-del':'warn','td-clear':'warn','pd-del':'warn','remove-tag':'warn','delete-set':'warn','delete-notebook':'warn','delete-chapter':'warn','delete-book':'warn','reset-data':'heavy'};
function hapFor(a,b){if(a==='mark-status'){const v=Number(b.dataset.status)||0;haptic(v===1?'success':v===3?'warn':v===2?'medium':'light');return}const k=HAP_MAP[a];if(k)haptic(k)}
function toast(t){try{if(/🎉/.test(t))haptic('success');else if(/^(Enter |Use a time|Invalid|Unsupported|Nothing to|That notebook|A notebook|Name cannot|Create a )/.test(t))haptic('error')}catch(_){}const x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('show'),1800)}
function go(screen,extra={}){Object.assign(state,extra,{screen});render();window.scrollTo({top:0,behavior:'instant'})}
function subjects(){return Object.keys(data.subjects)}
function paceInfo(sets){
 if(!sets||!sets.length)return null;
 let left=0,total=0;const stamps=[];
 sets.forEach(x=>{const q=Number(x.questions)||0;total+=q;left+=Math.max(0,q-(Number(x.solved)||0));(x.q||[]).forEach(v=>{if((Number(v.status)||0)===1&&v.doneAt)stamps.push(v.doneAt)})});
 if(!total)return null;

 if(!stamps.length)return {wait:true};
 const mid=t=>{const d=dayShift(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
 const today=mid(Date.now());
 const first=mid(Math.min.apply(null,stamps));
 const age=Math.round((today-first)/864e5)+1;
 if(age<3)return {wait:true};
 const span=Math.min(14,age);
 const cutoff=new Date(today.getFullYear(),today.getMonth(),today.getDate()-(span-1));
 const recent=stamps.filter(t=>mid(t)>=cutoff).length;
 if(!recent)return {stalled:true};
 const pace=recent/span;
 const days=Math.ceil(left/pace);
 const end=new Date(today.getFullYear(),today.getMonth(),today.getDate()+days);

}
function paceLine(sets){
 const p=paceInfo(sets);if(!p)return '';
 if(p.done)return '<span class="paceLine ok">✓ All solved</span>';
 if(p.wait)return '<span class="paceLine mute">⏱ Pace: needs 3 days of data</span>';
 if(p.stalled)return '<span class="paceLine warn">⏱ No progress in the last 2 weeks</span>';
 const r=p.pace>=10?Math.round(p.pace):Math.round(p.pace*10)/10;
 const dt=p.days>365?'over a year':p.end.toLocaleDateString(undefined,{day:'numeric',month:'short'});
 return `<span class="paceLine">⏱ ${r}/day · done by ${dt}</span>`;
}
function paceWidget(rows){
 if(!rows.length)return '';
 const items=rows.map(([label,sets])=>({label,html:paceLine(sets)})).filter(x=>x.html);
 if(!items.length)return '';
 return `<div class="card paceWidget"><div class="paceWidgetHead">Pace forecast<small>Based on your last 2 weeks</small></div>${items.map(x=>`<div class="paceWidgetRow"><span>${esc(x.label)}</span>${x.html}</div>`).join('')}</div>`;
}
function subjectSets(sub){return Object.values(data.sets||{}).filter(x=>x.subject===sub)}
function subjectStats(s){
 const sets=Object.values(data.sets||{}).filter(x=>x.subject===s);
 const questions=sets.reduce((n,x)=>n+(Number(x.questions)||0),0);
 const solved=sets.reduce((n,x)=>n+(Number(x.solved)||0),0);
 const notebooks=new Set(sets.map(x=>x.notebook||'Ungrouped')).size;
 const progress=questions?Math.round(solved/questions*100):0;
 return {questions,solved,notebooks:(data.notebooks[s]||[]).length,progress};
}
function dayKeyOf(t){var d=dayShift(t);return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function fh(h){h=h%24;return (h%12||12)+(h<12?' AM':' PM')}
function insights(){
 var m={},hrs=new Array(24).fill(0),now=Date.now(),i,rows=[];
 Object.values(data.sets||{}).forEach(function(x){(x.q||[]).forEach(function(q){if(q.doneAt){var k=dayKeyOf(q.doneAt);m[k]=(m[k]||0)+1;hrs[new Date(q.doneAt).getHours()]++}})});
 var tot=hrs.reduce(function(a,b){return a+b},0);if(!tot)return '';
 var bh=0,bv=-1,h;for(h=0;h<24;h++){var v=hrs[h]+hrs[(h+1)%24];if(v>bv){bv=v;bh=h}}
 rows.push(['⚡','You solve fastest between <b>'+fh(bh)+' and '+fh(bh+2)+'</b>']);
 var w1=0,w0=0;for(i=0;i<7;i++){w1+=m[dayKeyOf(now-i*864e5)]||0;w0+=m[dayKeyOf(now-(i+7)*864e5)]||0}
 if(w0)rows.push([w1>=w0?'📈':'📉','This week: <b>'+w1+' solved</b> ('+(w1>=w0?'+':'')+Math.round((w1-w0)/w0*100)+'% vs last week)']);

function myDayData(){if(!data.myDay||!Array.isArray(data.myDay.items))data.myDay={day:'',items:[],pastDue:[]};if(!Array.isArray(data.myDay.pastDue))data.myDay.pastDue=[];if(!Array.isArray(data.myDay.todos))data.myDay.todos=[];if(!data.myDay.rem)data.myDay.rem={on:false,time:'20:00',shown:''};const t=todayKey();if(data.myDay.day!==t){const prev=data.myDay.day;if(prev&&t<prev){data.myDay.day=t;save();return data.myDay}if(prev){try{const sn=buildShareText(new Date(prev+'T12:00:00'),data.myDay);if(sn[1])data.myDay.last={day:prev,text:sn[0]}}catch(_){}const pdw=new Date(prev+'T00:00:00').getDay();const keep=new Set();data.myDay.items.forEach(i=>{const tg=Number(i.target)||0,dn=Number(i.done)||0;if(!mdRec(i)){if(dn<tg){i.target=tg-dn;keep.add(i)}return}if(!mdOn(i,pdw))return;if(dn<tg){const left=tg-dn,ex=data.myDay.pastDue.find(p=>p.title===i.title);if(ex){ex.left=Math.min(Number(ex.left)||left,left);ex.target=ex.left;ex.done=0;ex.from=prev}else data.myDay.pastDue.push({id:pdId(),title:i.title,left:left,from:prev,target:left,done:0})}});data.myDay.pastDue=data.myDay.pastDue.slice(-40);data.myDay.items=data.myDay.items.filter(i=>mdRec(i)||keep.has(i))}data.myDay.items.forEach(i=>{if(i.base!=null){i.target=i.base;delete i.base}i.done=0;delete i.banked});data.myDay.tdCleared=0;data.myDay.day=t;save()}return data.myDay}

function mdOn(i,dow){return !Array.isArray(i.days)||!i.days.length||i.days.includes(dow)}function mdDoneToday(){return (myDayData().items||[]).reduce((n,i)=>n+(Number(i.done)||0)+(Number(i.banked)||0),0)}function shareOut(txt){if(navigator.share){navigator.share({text:txt}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>toast('Summary copied'),()=>toast('Could not share'))}else toast('Sharing not supported here')}function buildShareText(dt,md){const L=[],ds=dt.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}),dk=dt.toDateString(),bySub={},byNb={};let trk=0,t0=0,t1=0;Object.values(data.sets||{}).forEach(x=>(x.q||[]).forEach(q=>{if(q.doneAt&&dayShift(q.doneAt).toDateString()===dk){trk++;bySub[x.subject]=(bySub[x.subject]||0)+1;const nb=x.notebook||x.subject||'';(byNb[nb]=byNb[nb]||{})[x.name]=(byNb[nb][x.name]||0)+1;if(!t0||q.doneAt<t0)t0=q.doneAt;if(q.doneAt>t1)t1=q.doneAt}}));const its=(md&&md.items)||[],td=(md&&md.todos)||[],tcl=Number(md&&md.tdCleared)||0,mdn=its.reduce((n,i)=>n+(Number(i.done)||0)+(Number(i.banked)||0),0);const tm=t=>new Date(t).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});L.push('📚 JEE progress · '+ds);L.push('✅ Done today: '+(trk+mdn));L.push('📘 Tracker: '+trk+' question'+(trk===1?'':'s'));L.push('🎯 My Day: '+mdn+' question'+(mdn===1?'':'s'));const sb=Object.entries(bySub).map(([k,v])=>k+' '+v).join(' · ');if(sb)L.push('📘 '+sb);if(td.length+tcl)L.push('☑ Checklist: '+(td.filter(x=>x.done).length+tcl)+' of '+(td.length+tcl)+' done');if(its.length){const pend=its.filter(i=>(Number(i.done)||0)<(Number(i.target)||0)).length;L.push(pend?'⏭ Pending for tomorrow: '+pend+' target'+(pend===1?'':'s'):'🎉 All My Day targets finished')}return [L.join('\n'),trk+mdn>0||its.length>0||td.length+tcl>0]}function mdRec(i){return i.rep===true||(Array.isArray(i.days)&&i.days.length>0)}

function myDayWidget(){const md=myDayData();const items=md.items.filter(i=>mdOn(i,dayShift().getDay()));const PAL=['#ff4d6d','#4aa7ff','#a78bfa','#f5b942','#22d3a5'];const og=i=>(Number(i.target)||0)+(Number(i.banked)||0),pgr=i=>(Number(i.done)||0)+(Number(i.banked)||0);const tot=items.reduce((n,i)=>n+og(i),0);const dn=items.reduce((n,i)=>n+Math.min(pgr(i),og(i)),0);const td=md.todos,clr=Number(md.tdCleared)||0,tdTot=td.length+clr,tdDone=td.filter(x=>x.done).length+clr,units=items.length+tdTot,frac=items.reduce((n,i)=>n+Math.min(1,pgr(i)/(og(i)||1)),0)+tdDone,p=units?Math.round(frac/units*100):0,tp=tot?Math.round(dn/tot*100):0,cp=tdTot?Math.round(tdDone/tdTot*100):0;const cmp=items.filter(i=>(Number(i.done)||0)>=(Number(i.target)||1)).length;const dt=dayShift().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'});

const pd=md.pastDue||[];const pdFmt=k=>{const d=new Date(k+'T00:00:00');return isNaN(d)?k:d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})};

function sha256(s){const b=Array.from(new TextEncoder().encode(s));const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const L=b.length*8;b.push(0x80);while(b.length%64!==56)b.push(0);for(let i=7;i>=0;i--)b.push(i>3?0:(L>>>(i*8))&255);const R=(x,n)=>(x>>>n)|(x<<(32-n));for(let o=0;o<b.length;o+=64){const w=new Array(64);for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];for(let i=16;i<64;i++){const s0=R(w[i-15],7)^R(w[i-15],18)^(w[i-15]>>>3),s1=R(w[i-2],17)^R(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}let[a,c,d,e,f,g,h,k]=H;for(let i=0;i<64;i++){const S1=R(f,6)^R(f,11)^R(f,25),ch=(f&g)^(~f&h),t1=(k+S1+ch+K[i]+w[i])|0,S0=R(a,2)^R(a,13)^R(a,22),mj=(a&c)^(a&d)^(c&d),t2=(S0+mj)|0;k=h;h=g;g=f;f=(e+t1)|0;e=d;d=c;c=a;a=(t1+t2)|0}H=[H[0]+a,H[1]+c,H[2]+d,H[3]+e,H[4]+f,H[5]+g,H[6]+h,H[7]+k].map(x=>x|0)}return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
const PIN_HASH="ee5a78a13212dcf837e2acdc2d4bb00f979201b84908831dbe28c04a35ee75e7",PIN_LEN=4,PIN_MAX=5,PIN_WAIT=30000;

function pinHashOf(p){return sha256('jee-tracker-lock:'+p)}
function pinCur(){return (data.settings&&data.settings.pinHash)||PIN_HASH}
function pinOK(p){return pinHashOf(p)===pinCur()}
function pinPrompt(){if(pinCtx==='change')return pinStep==='old'?'Enter your current PIN':pinStep==='new'?'Enter a new PIN':'Enter the new PIN again';return 'Enter your PIN'}

function pinGet(k){try{return Number(localStorage.getItem(k))||0}catch(_){return 0}}

function pinIcon(){return `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>`}
function pinPad(ctx){
  const key=n=>`<button class="pinKey" data-action="pin-key" data-k="${n}" aria-label="${n}"><b>${n}</b></button>`;
 const left=ctx!=='splash'?`<button class="pinKey pinText" data-action="pin-cancel">Cancel</button>`:`<span class="pinKey pinGhost"></span>`;
 const del=`<button class="pinKey pinText pinDel" data-action="pin-key" data-k="del" aria-label="Delete"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9.5l-5 5M12 9.5l5 5"/></svg></button>`;

 return `<div class="pinWrap" data-ctx="${ctx}"><div class="pinBadge">${pinIcon()}<span>${pinBadgeText(ctx)}</span></div><div class="pinDots" role="status" aria-label="PIN entry">${pinDots()}</div><div class="pinMsg${w?' err':''}">${w?'Too many attempts · try again in '+Math.ceil(w/1000)+'s':pinPrompt()}</div><div class="pinGrid">${[1,2,3,4,5,6,7,8,9].map(key).join('')}${left}${key(0)}${del}</div></div>`}
function pinUI(msg,cls){const w=document.querySelector('.pinWrap');if(!w)return;w.querySelector('.pinDots').innerHTML=pinDots();if(msg!=null){const m=w.querySelector('.pinMsg');m.textContent=msg;m.className='pinMsg'+(cls?' '+cls:'')}}
function pinKey(k){
 if(pinBusy)return;
 const left=pinWaitLeft();
 if(left>0){pinUI('Too many attempts · try again in '+Math.ceil(left/1000)+'s','err');return}
 if(k==='del'){pinBuf=pinBuf.slice(0,-1);pinUI(pinPrompt());return}

}
function pinAdvance(step,msg,cls){
 pinStep=step;pinBuf='';pinBusy=false;
 const o=document.querySelector('.pinOverlay');if(!o)return;
 const t=o.querySelector('.pinTitle'),u=o.querySelector('.pinSub'),b=o.querySelector('.pinBadge span'),w=o.querySelector('.pinWrap');
 if(t)t.textContent=step==='confirm'?'Confirm new PIN':'Change PIN';
 if(u)u.textContent=step==='old'?'Enter your current PIN to continue':step==='new'?'Choose a new 4-digit PIN':'Enter the new PIN once more';

}
function pinChangeStep(){
 const w=document.querySelector('.pinWrap');
 if(pinStep==='new'){
  if(pinOK(pinBuf)){if(w)w.classList.add('shake');pinBuzz([45,40,45]);pinUI('Choose a different PIN','err');setTimeout(()=>pinAdvance('new','Choose a different PIN','err'),380);return}
  pinNew=pinBuf;pinAdvance('confirm');return
 }
 if(pinBuf===pinNew){
  data.settings.pinHash=pinHashOf(pinNew);save();pinBuzz(18);
  if(w){w.classList.add('ok');const bg=w.querySelector('.pinBadge');if(bg)bg.innerHTML=pinIconOpen()+'<span>PIN changed</span>'}
  pinUI('Your new PIN is set','ok');
  setTimeout(()=>{pinCloseOverlay();render();toast('PIN changed')},800);return
 }
 if(w)w.classList.add('shake');pinBuzz([45,40,45]);pinUI(null);pinUI('PINs don\'t match · try again','err');
 setTimeout(()=>{pinNew='';pinAdvance('new','PINs didn\'t match · enter a new PIN','err')},420)
}
function pinCheck(){
 const w=document.querySelector('.pinWrap');
 if(pinCtx==='change'&&pinStep!=='old'){pinChangeStep();return}
 if(pinOK(pinBuf)){
  pinSet('jee-pin-fails',0);pinSet('jee-pin-until',0);
  if(pinCtx==='change'){pinBuzz(18);pinAdvance('new');return}
  if(w){w.classList.add('ok');const bg=w.querySelector('.pinBadge');if(bg)bg.innerHTML=pinIconOpen()+'<span>'+(pinCtx==='off'?'Verified':'Unlocked')+'</span>'}pinUI(pinCtx==='off'?'PIN verified':'Welcome back','ok');pinBuzz(18);
  setTimeout(()=>{pinBuf='';pinBusy=false;pinDone()},650);return
 }

 if(f>=PIN_MAX){pinSet('jee-pin-fails',0);pinSet('jee-pin-until',Date.now()+PIN_WAIT);msg='Too many attempts · try again in '+Math.ceil(PIN_WAIT/1000)+'s'}
 else{pinSet('jee-pin-fails',f);msg='Incorrect PIN · '+(PIN_MAX-f)+(PIN_MAX-f===1?' attempt left':' attempts left')}
 if(w)w.classList.add('shake');pinUI(null);pinUI(msg,'err');pinBuzz([45,40,45]);
 setTimeout(()=>{pinBuf='';pinBusy=false;const x=document.querySelector('.pinWrap');if(x)x.classList.remove('shake');pinUI()},330)
}
function pinDone(){
 if(pinCtx==='off'){pinCloseOverlay();data.settings.appLock=false;save();render();toast('App Lock turned off');return}

}

}

   if(useCloud&&r)applyRemote(r);else markDirty();
   ready=true;writeMeta();
   if(meta.dirty)schedulePush(300);else setStatus('synced');
   return;
  }
  ready=true;
  const re=r?(r.editedAt||0):0,sa=meta.syncedAt||0;
  if(!r){if(hasContent()||meta.dirty){markDirty();schedulePush(300)}else setStatus('synced');return}
  if(re===sa){if(meta.dirty)schedulePush(300);else setStatus('synced');return}
  if(re>sa){
   if(!meta.dirty||re>(meta.editedAt||0))applyRemote(r);else schedulePush(300);
   return;
  }
  if(meta.dirty)schedulePush(300);else setStatus('synced');
 }
 function fixState(){
  if(state.setKey&&!data.sets[state.setKey]){state.setKey=null;state.notebook=null;if(state.screen!=='splash')state.screen='home'}
 }
 function applyRemote(r){
  try{
   JSON.parse(r.data);
   applying=true;
   snap();
   localStorage.setItem(KEY,r.data);
   data=load();
   localStorage.setItem(KEY,JSON.stringify(data));
   meta.syncedAt=r.editedAt||0;meta.dirty=false;meta.lastSync=Date.now();writeMeta();
   applying=false;
   fixState();
   try{myDayData()}catch(_){}
   softRender();
   setStatus('synced');
  }catch(e){applying=false;setStatus('error','Could not apply cloud data')}
 }
 function softRender(){
  if(state.screen==='splash')return;
  const a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){pendingRender=true;return}
  try{render()}catch(_){}
 }
 document.addEventListener('focusout',()=>{if(pendingRender)setTimeout(()=>{pendingRender=false;softRender()},200)});

 function schedulePush(ms){clearTimeout(timer);timer=setTimeout(push,ms);if(user&&navigator.onLine)setStatus('syncing')}
 async function push(){
  if(!user||!ready||!ref)return;
  if(!navigator.onLine){setStatus('offline');return}
  if(pushing){schedulePush(1500);return}
  const json=JSON.stringify(data);
  if(new TextEncoder().encode(json).length>MAX_BYTES){setStatus('error','Data too large for cloud sync');return}
  const ed=meta.editedAt||Date.now();
  pushing=true;setStatus('syncing');
  try{
   await ref.set({data:json,editedAt:ed,device:DEVICE,prev:(lastCloudJson&&lastCloudJson!==json)?lastCloudJson:null,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
   meta.syncedAt=ed;if((meta.editedAt||0)===ed)meta.dirty=false;
   lastCloudJson=json;meta.lastSync=Date.now();writeMeta();
   if(meta.dirty){setStatus('syncing');schedulePush(1500)}else setStatus('synced');
  }catch(e){setStatus(navigator.onLine?'error':'offline',e.message);schedulePush(30000)}
  finally{pushing=false}
 }
 window.syncTouch=function(){
  if(applying||!enabled)return;
  markDirty();
  if(user&&ready)schedulePush(3000);
 };

 async function pull(){
  if(!user||!ref)return;
  try{const ds=await ref.get({source:'server'});onRemote(ds.exists?ds.data():null)}
  catch(e){setStatus(navigator.onLine?'error':'offline',e.message)}
 }
 async function signIn(){
  try{if(!fb)await initFB();await start()}catch(e){toast('Cannot reach sign-in — check your internet');return}
  const p=new firebase.auth.GoogleAuthProvider();
  try{await fb.auth.signInWithPopup(p)}
  catch(e){
   const c=e&&e.code;
   if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'||c==='auth/web-storage-unsupported'){try{await fb.auth.signInWithRedirect(p)}catch(_){toast('Sign-in failed')}}
   else if(c!=='auth/popup-closed-by-user'&&c!=='auth/cancelled-popup-request')toast('Sign-in failed: '+String(c||'error').replace('auth/',''));
  }
 }
 async function restorePrev(){
  if(!user||!ref)return;
  try{
   const ds=await ref.get({source:'server'}),d=ds.exists?ds.data():null;
   if(!d||!d.prev){toast('No earlier cloud version yet');return}
   if(!confirm('Go back to the previous cloud version? It replaces the data on this device and in the cloud.'))return;
   applying=true;snap();localStorage.setItem(KEY,d.prev);data=load();localStorage.setItem(KEY,JSON.stringify(data));applying=false;
   fixState();markDirty();softRender();schedulePush(300);toast('Previous cloud version restored');
  }catch(e){applying=false;toast('Could not restore')}
 }

 document.addEventListener('click',ev=>{
  const b=ev.target.closest&&ev.target.closest('[data-action^="sync-"]');if(!b)return;
  const a=b.dataset.action;
  if(a==='sync-signin'){signIn();return}
  if(a==='sync-now'){toast('Syncing…');pull();return}
  if(a==='sync-restore'){restorePrev();return}
  if(a==='sync-signout'){if(!confirm('Sign out of cloud sync? Your data stays on this device.'))return;if(fb)fb.auth.signOut().then(()=>toast('Signed out'));return}
 });
 document.addEventListener('visibilitychange',()=>{
  if(!enabled)return;
  if(document.visibilityState==='hidden'){if(user&&ready&&meta.dirty){clearTimeout(timer);push()}}
  else if(user)pull();
 });
 window.addEventListener('pagehide',()=>{if(user&&ready&&meta.dirty){clearTimeout(timer);push()}});
 window.addEventListener('online',()=>{if(!enabled)return;if(!fb)start();else if(user)pull()});
 window.addEventListener('offline',()=>setStatus('offline'));
