:root{--nz0:#050a14;--nz1:#0a1424;--nz2:#0d1e33;--nz3:#2a4a6c;--nz4:#7890a8;--nz5:#eef5ff;--bgRgb:5,10,20;--bgRgb2:10,28,48;--beamA:255,25,70;--beamB:22,113,210;--beamOpacity:1;--bg:var(--nz0);--panel:var(--nz1);--panel2:var(--nz2);--line:var(--nz3);--muted:var(--nz4);--text:var(--nz5);--blue:#238cff;--blue2:#1556a0;--red:#ff2448;--red2:#c91535;--green:#16d6a0;--gold:#ffb83d;--purple:#a66cff;--shadow:0 18px 50px rgba(0,0,0,.35)}

[data-theme="glacier-blue"] .app:before,[data-theme="glacier-blue"] .app:after,[data-theme="sunrise-coral"] .app:before,[data-theme="sunrise-coral"] .app:after{opacity:.5}
[data-theme="glacier-blue"] .card,[data-theme="sunrise-coral"] .card{background:linear-gradient(145deg,rgba(var(--bgRgb2),.97),rgba(var(--bgRgb),.97));box-shadow:0 10px 30px rgba(20,40,70,.08),inset 0 1px 0 rgba(255,255,255,.6)}
[data-theme="glacier-blue"] .refDetailHero,[data-theme="sunrise-coral"] .refDetailHero,[data-theme="glacier-blue"] .dailyPanel,[data-theme="sunrise-coral"] .dailyPanel{background:linear-gradient(145deg,rgba(var(--bgRgb2),.96),rgba(var(--bgRgb),.98))}

.themeCard{padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.themeSwatch{position:relative;text-align:left;padding:12px 12px 12px 12px;border-radius:15px;border:1px solid var(--nz3);background:var(--nz2);display:flex;flex-direction:column;gap:9px}.themeSwatch.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(35,140,255,.22)}.themeDots{display:flex;gap:5px}.themeDots i{width:16px;height:16px;border-radius:50%;display:block;border:1px solid rgba(255,255,255,.18);box-shadow:0 2px 6px rgba(0,0,0,.25)}.themeText{display:flex;flex-direction:column}.themeText b{font-size:11px}.themeText span{font-size:8px;color:var(--nz4);margin-top:2px}.themeCheck{position:absolute;top:10px;right:10px;width:18px;height:18px;border-radius:50%;background:var(--blue);color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center}
.themeSwatch[data-theme="midnight-crimson"]{background:#0d1e33;border-color:#2a4a6c}.themeSwatch[data-theme="midnight-crimson"] .themeText b{color:#eef5ff}.themeSwatch[data-theme="midnight-crimson"] .themeText span{color:#7890a8}
.themeSwatch[data-theme="deep-ocean"]{background:#0b2a40;border-color:#2a6a86}.themeSwatch[data-theme="deep-ocean"] .themeText b{color:#eaf8ff}.themeSwatch[data-theme="deep-ocean"] .themeText span{color:#7fb0c4}
.themeSwatch[data-theme="glacier-blue"]{background:#e2f0f8;border-color:#a9cfe3}.themeSwatch[data-theme="glacier-blue"] .themeText b{color:#0f2942}.themeSwatch[data-theme="glacier-blue"] .themeText span{color:#4f7a99}
.themeSwatch[data-theme="sunrise-coral"]{background:#fce8dd;border-color:#e8b49b}.themeSwatch[data-theme="sunrise-coral"] .themeText b{color:#3a1810}.themeSwatch[data-theme="sunrise-coral"] .themeText span{color:#9c5b45}

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden}button,input,select{font:inherit}button{cursor:pointer;color:inherit}.app{min-height:100vh;position:relative;background:radial-gradient(circle at 85% 10%,rgba(var(--beamA),.13),transparent 25%),radial-gradient(circle at 5% 55%,rgba(var(--beamB),.13),transparent 28%),linear-gradient(180deg,var(--nz0),var(--nz1) 52%,var(--nz0))}
.app:before,.app:after{content:"";position:fixed;pointer-events:none;z-index:0;width:55vw;height:180vh;background:linear-gradient(115deg,transparent 42%,rgba(var(--beamA),.08) 47%,rgba(var(--beamA),.25) 49%,transparent 53%);transform:rotate(7deg);top:-55vh;right:-18vw;opacity:var(--beamOpacity)}.app:after{transform:rotate(-18deg);opacity:calc(var(--beamOpacity) * .65);right:auto;left:-25vw;top:-65vh}
.shell{position:relative;z-index:1;width:100%;max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:92px}.screen{min-height:100vh;padding:18px 16px 28px}.hidden{display:none!important}
/* splash */
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px;position:relative;overflow:hidden}
.splash:before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 50% 38%,rgba(255,35,75,.16),transparent 42%),radial-gradient(circle at 20% 85%,rgba(30,110,210,.14),transparent 40%);pointer-events:none;z-index:0}
.splash>*{position:relative;z-index:1;animation:splashUp .5s cubic-bezier(.22,.9,.3,1) both}
.splash .logo{animation-delay:0s}.splash h1{animation-delay:.06s}.splash .tagline{animation-delay:.12s}.splash .get{animation-delay:.18s}.splash .micro{animation-delay:.24s}
@keyframes splashUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.splash h1{font-size:38px;line-height:.98;margin:8px 0 4px;font-weight:900;letter-spacing:-1.8px}
.splash h1 span{color:var(--red);text-shadow:0 0 22px rgba(255,35,75,.35)}
.tagline{color:#9db2c9;font-size:14px;letter-spacing:2.4px;font-weight:500}.tagAccent{color:var(--red);font-weight:800;letter-spacing:2.8px;text-shadow:0 0 18px rgba(255,35,75,.4)}
.get{margin-top:52px;width:196px;height:53px;border:1px solid #ff5d78;border-radius:16px;background:linear-gradient(135deg,#ff3a58 0%,#e21440 55%,#c9103a 100%);font-weight:800;letter-spacing:.3px;box-shadow:0 10px 30px rgba(216,19,54,.35),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s ease}
.get:active{transform:scale(.96)}
.micro{position:absolute;bottom:30px;color:#7b8fa6;font-size:11.5px;letter-spacing:.3px}
.noMotion .splash>*{animation:none}
/* common */
.topbar{display:flex;align-items:center;gap:11px;padding:8px 0 20px;position:sticky;top:0;z-index:8;background:linear-gradient(180deg,rgba(var(--bgRgb),.97) 72%,rgba(var(--bgRgb),0));backdrop-filter:blur(12px)}.back,.iconBtn{width:39px;height:39px;border:1px solid var(--nz4);background:linear-gradient(145deg,var(--nz2),var(--nz1));border-radius:13px;display:grid;place-items:center;flex:none}.topbar .grow{flex:1;min-width:0}.eyebrow{font-size:9px;letter-spacing:2.1px;color:var(--nz5);font-weight:900}.title{font-size:22px;line-height:1.12;font-weight:900;margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:10px;color:var(--muted)}.brand{font-weight:900;font-size:16px;display:flex;align-items:center;gap:7px;letter-spacing:-.2px}.brandMark{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:9px;font-weight:950;color:var(--nz5);background:linear-gradient(145deg,#ff3657,#b50f2d);border:1px solid #ff6279;box-shadow:0 0 16px rgba(255,36,72,.25)}.brand span{color:var(--red)}.card{background:linear-gradient(145deg,rgba(var(--bgRgb2),.97),rgba(var(--bgRgb),.97));border:1px solid var(--nz3);border-radius:19px;box-shadow:0 18px 50px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.025)}
/* home */
.greeting{display:flex;align-items:center;justify-content:space-between;margin:12px 0 18px}.greeting h1{font-size:24px;line-height:1.05;margin:4px 0}.greeting p{color:var(--nz5);font-size:11px;margin:0}.ring{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--red) 0 var(--pct,43%),var(--nz3) var(--pct,43%) 100%);position:relative}.ring:after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--nz1)}.ring div{position:relative;z-index:1;text-align:center}.ring b{display:block;font-size:18px}.ring span{font-size:8px;color:var(--nz5)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{padding:13px 8px;text-align:center}.metric b{display:block;font-size:18px}.metric span{font-size:8px;color:var(--nz5)}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}.sectionHead b{font-size:15px}.sectionHead button{border:0;background:none;color:var(--nz5);font-size:10px}.subject{padding:13px;display:flex;align-items:center;gap:11px;margin-bottom:8px}.subjectIcon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:linear-gradient(145deg,var(--nz3),var(--nz1));border:1px solid var(--nz4)}.subjectText{flex:1;min-width:0}.subjectText b{display:block;font-size:12px}.subjectText span{font-size:8px;color:var(--nz5)}.miniBar{height:5px;border-radius:10px;background:var(--nz2);margin-top:8px;overflow:hidden}.miniBar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ff4c62)}.subjectPct{font-size:10px;color:var(--nz5)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.snapshotMetrics{grid-template-columns:repeat(4,1fr)}.action{padding:13px;text-align:left}.action b{display:block;font-size:11px}.action span{font-size:8px;color:var(--nz5)}
/* subject/notebook */
.search{display:flex;gap:8px;margin:8px 0 15px}.search input{width:100%;height:43px;border-radius:14px;border:1px solid var(--nz3);background:var(--nz1);color:var(--nz5);padding:0 13px;outline:none}.search input:focus{border-color:#398eea;box-shadow:0 0 0 3px rgba(35,140,255,.1)}.newBtn{border:1px solid #8e1933;background:linear-gradient(145deg,var(--nz1),var(--nz0));border-radius:13px;padding:0 13px;font-weight:800;font-size:11px;white-space:nowrap}.book{padding:15px;display:flex;align-items:center;gap:12px;margin-bottom:8px}.bookIcon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--nz2);border:1px solid var(--nz4)}.bookText{flex:1;min-width:0}.bookText b{display:block;font-size:12px}.bookText span{display:block;color:var(--nz5);font-size:9px;margin-top:3px}.chev{font-size:20px;color:var(--nz5)}.subTabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0}.tab{height:42px;border-radius:14px;border:1px solid var(--nz3);background:var(--nz1);color:var(--nz5);font-weight:800}.tab.active{background:linear-gradient(135deg,var(--nz3),var(--nz2));border-color:#3c92ec;color:var(--nz5)}
.setRow{padding:13px;margin-bottom:8px;display:flex;align-items:center;gap:11px}.progressCircle{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#2e93ff 0 20%,var(--nz3) 20%);position:relative;flex:none}.progressCircle:after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--nz1)}.progressCircle span{position:relative;z-index:1;font-size:9px;font-weight:900}.setInfo{flex:1;min-width:0}.setInfo b{font-size:13px}.setInfo div{font-size:9px;color:var(--nz5);margin-top:4px}.rowBtns{display:flex;gap:6px}.openBtn,.renameBtn{height:38px;padding:0 12px;border-radius:13px;font-size:10px;font-weight:900}.openBtn{border:1px solid #ff435d;background:linear-gradient(135deg,#f21e3f,#d40e30);box-shadow:0 5px 15px rgba(242,30,63,.18)}.renameBtn{border:1px solid var(--nz4);background:var(--nz2);color:var(--nz5)}
/* set dashboard */
.stats5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.stat5{padding:10px 3px;text-align:center;border-radius:13px;background:var(--nz1);border:1px solid var(--nz3)}.stat5 b{display:block;font-size:15px}.stat5 span{font-size:7px;color:var(--nz5)}.progress{height:7px;border-radius:8px;background:var(--nz2);overflow:hidden;margin:14px 0 5px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#2f9aff,#22d9a0)}.progressLabel{font-size:8px;color:var(--nz5)}.questionGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.qbtn{aspect-ratio:1;border:1px solid var(--nz3);background:var(--nz1);border-radius:10px;font-weight:800;font-size:11px}.qbtn.done{background:linear-gradient(145deg,var(--nz1),#07584c);border-color:#16a98c;color:#70f0d3}.qbtn.current{border-color:#ff284c;box-shadow:0 0 0 2px rgba(255,40,76,.18);color:#ff7890}.continue{padding:11px 12px;margin:10px 0;display:flex;align-items:center;justify-content:space-between}.continue small{display:block;color:var(--nz5);font-size:8px}.continue b{font-size:11px}.continue .openBtn{height:35px}
/* question */
.questionCard{padding:16px}.questionCard .qmeta{display:flex;justify-content:space-between;color:var(--nz5);font-size:9px;margin-bottom:15px}.questionText{font-size:14px;line-height:1.5;font-weight:750}.option{width:100%;text-align:left;margin-top:9px;padding:12px;border-radius:13px;border:1px solid var(--nz3);background:var(--nz1);color:var(--nz5);font-size:11px}.option.selected{border-color:var(--red);box-shadow:0 0 0 2px rgba(255,36,72,.14);background:var(--nz1)}.option.correct{border-color:#12c99b;background:var(--nz1)}.qnav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.primary{height:44px;border:1px solid #ff435d;border-radius:14px;background:linear-gradient(135deg,#ff2448,#d81335);font-weight:900}.secondary{height:44px;border:1px solid var(--nz4);border-radius:14px;background:var(--nz1);font-weight:800}
/* analysis */
.analysisCards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.analysisCard{padding:14px 8px;text-align:left;border-radius:15px;border:1px solid var(--nz3);background:var(--nz1);position:relative;overflow:hidden}.analysisCard b{font-size:20px;display:block}.analysisCard span{font-size:9px;color:var(--nz5)}.analysisCard small{display:block;font-size:8px;color:var(--nz4);margin-top:5px}.analysisCard.done{border-color:#16c79b;background:linear-gradient(145deg,var(--nz1),var(--nz1))}.analysisCard.done:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#16d6a0}.analysisCard.left{border-color:#ff294f;background:linear-gradient(145deg,var(--nz2),var(--nz1))}.analysisCard.left:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#ff294f}.analysisCard.revision{border-color:#d69a2b;background:linear-gradient(145deg,var(--nz1),var(--nz1))}.analysisCard.revision:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#ffb83d}.analysisCard.difficult{border-color:#b746ff;background:linear-gradient(145deg,var(--nz2),var(--nz1))}.analysisCard.difficult:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#a66cff}.analysisTools{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.analysisTool{height:38px;border-radius:12px;border:1px solid var(--nz3);background:var(--nz1);color:var(--nz5);font-size:9px;font-weight:800}.analysisTool.active{border-color:#3c92ec;background:var(--nz3);color:var(--nz5)}.accuracy{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:22px auto;background:conic-gradient(var(--green) 0 var(--acc),var(--nz2) var(--acc) 100%);position:relative;box-shadow:0 0 0 1px rgba(22,214,160,.08),0 12px 35px rgba(0,0,0,.25)}.accuracy:after{content:"";position:absolute;inset:13px;background:var(--nz1);border-radius:50%}.accuracy div{position:relative;z-index:1;text-align:center}.accuracy b{font-size:25px;display:block}.accuracy span{font-size:9px;color:var(--nz5)}.topic{margin:11px 0}.topicTop{display:flex;justify-content:space-between;font-size:9px;margin-bottom:5px}.topicBar{height:7px;border-radius:7px;background:var(--nz2);overflow:hidden}.topicBar i{display:block;height:100%;background:linear-gradient(90deg,#ff2448,#ffb83d,#16d6a0)}
/* bottom */
.bottom{position:fixed;z-index:50;left:50%;bottom:10px;transform:translateX(-50%);width:min(400px,calc(100% - 28px));display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:6px;border:1px solid var(--nz3);border-radius:23px;background:rgba(var(--bgRgb),.95);backdrop-filter:blur(14px);box-shadow:0 12px 35px rgba(0,0,0,.45)}.navBtn{border:0;background:none;border-radius:16px;padding:9px 3px;color:var(--nz4);font-size:8px;font-weight:800}.navBtn span{display:block;font-size:18px;margin-bottom:3px}.navBtn.active{background:var(--nz3);color:var(--nz5)}.navBtn.active span{color:#51a9ff}
.toast{position:fixed;z-index:100;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--nz2);border:1px solid var(--nz4);padding:10px 14px;border-radius:12px;font-size:10px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:700px){.shell{max-width:900px}.screen{padding-left:24px;padding-right:24px}.subjectsGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.subject{margin:0}.booksGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.book{margin:0}.setsGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.setRow{margin:0}}
.statusRows{display:grid;gap:9px;margin-top:10px}.statusRows button{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;border:1px solid var(--nz3);border-radius:16px;background:var(--nz1);color:var(--nz5);font-weight:800}.statusRows button b{font-size:18px}.analysisProgress{height:10px;border-radius:99px;background:var(--nz2);border:1px solid var(--nz3);overflow:hidden;margin-top:10px}.analysisProgress i{display:block;height:100%;background:linear-gradient(90deg,#ff2148,#ffcf45,#2be27c);border-radius:99px}.qbtn.redo{border-color:#d4a82c;color:#ffd95b}.qbtn.difficult{border-color:#b65cff;color:#d8a7ff}.secondary.activeStatus{border-color:#45a6ff;background:var(--nz3);color:var(--nz5)}.emptyState{grid-column:1/-1;text-align:center;padding:24px;color:var(--nz5);font-size:12px}.sectionHead small{color:var(--nz4);font-weight:700}.statusActions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}.statusActions .secondary{margin:0;padding:12px 8px}.qbtn.done{border-color:#2be27c;color:#7dffb1}.qbtn.current{box-shadow:0 0 0 1px #ff2a4d,0 0 18px rgba(255,42,77,.22)}
/* polished dashboard additions */
.homeHero{padding:14px 15px;border:1px solid var(--nz3);border-radius:20px;background:linear-gradient(145deg,rgba(10,28,48,.98),rgba(6,16,30,.97));box-shadow:0 16px 42px rgba(0,0,0,.28);position:relative;overflow:hidden}.heroGoal{display:inline-flex;align-items:center;gap:6px;margin-top:11px;padding:6px 11px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,45,90,.35);font-size:9px;font-weight:800;letter-spacing:1.4px;color:rgba(255,255,255,.8);text-transform:uppercase}
.homeHero:after{content:"";position:absolute;width:150px;height:150px;right:-60px;top:-70px;border-radius:50%;background:radial-gradient(circle,rgba(var(--beamA),.22),transparent 68%);pointer-events:none}

<script>
'use strict';
// CLEAN EMPTY DATABASE — no demo/sample questions or fake progress.
// A fresh storage key prevents data from earlier test builds from leaking into this build.
const KEY='jee-tracker-clean-v1';
const seed={
 subjects:{
  Physics:{icon:'⚛',accent:'#378ADD',sets:0,questions:0,progress:0},
  Chemistry:{icon:'⚗',accent:'#D85A30',sets:0,questions:0,progress:0},
  Mathematics:{icon:'π',accent:'#7F77DD',sets:0,questions:0,progress:0}
 },
 notebooks:{Physics:[],Chemistry:[],Mathematics:[]},
 sets:{},
 referenceBooks:[],
 settings:{glow:true,compact:false,animations:true,dailyTarget:30,theme:'midnight-crimson',liquid:false,haptics:true},
 myDay:{day:'',items:[],pastDue:[],todos:[],rem:{on:false,time:'20:00',shown:''}}
};
function load(){
 try{
  const raw=localStorage.getItem(KEY);
  if(!raw) return JSON.parse(JSON.stringify(seed));
  const saved=JSON.parse(raw)||{};
  return {
   subjects:{...seed.subjects,...(saved.subjects||{})},
   notebooks:{...seed.notebooks,...(saved.notebooks||{})},
   sets:{...(saved.sets||{})},
   referenceBooks:Array.isArray(saved.referenceBooks)?saved.referenceBooks.map(b=>{
    const out={...b};
    if(!Array.isArray(out.chapterList) && Number(out.chapters)>0) out.chapterList=Array.from({length:Number(out.chapters)},(_,i)=>({name:`Chapter ${i+1}`,done:i<(Number(out.done)||0)}));
    return out;
   }):[],
   settings:{...seed.settings,...(saved.settings||{})},
   myDay:{day:(saved.myDay&&saved.myDay.day)||'',items:Array.isArray(saved.myDay&&saved.myDay.items)?saved.myDay.items:[],pastDue:Array.isArray(saved.myDay&&saved.myDay.pastDue)?saved.myDay.pastDue:[],todos:Array.isArray(saved.myDay&&saved.myDay.todos)?saved.myDay.todos:[],rem:(saved.myDay&&saved.myDay.rem)||{on:false,time:'20:00',shown:''}}
  };
 }catch(e){try{const bad=localStorage.getItem(KEY);if(bad)localStorage.setItem(KEY+'-rescue',bad)}catch(_){}return JSON.parse(JSON.stringify(seed))}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('⚠ Could not save (storage full/blocked). Export a backup now!')}}
function snap(){try{localStorage.setItem(KEY+'-prev',JSON.stringify(data))}catch(_){}}
function recount(x){x.solved=x.q.filter(v=>(Number(v.status)||0)===1).length;x.difficult=x.q.filter(v=>(Number(v.status)||0)===3).length;x.revision=x.q.filter(v=>v.revision===true).length}
let data=load();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
const state={screen:'splash',subject:'Physics',notebook:null,setKey:null,question:1,tab:'questions',filter:'all',analysisView:'overview',search:'',referenceBook:null};
const LA_KEY='jee-last-active',SPLASH_COOLDOWN=60000;
function markActive(){try{localStorage.setItem(LA_KEY,String(Date.now()))}catch(_){}}
function awayMs(){try{const t=Number(localStorage.getItem(LA_KEY));return t?Date.now()-t:Infinity}catch(_){return Infinity}}
if(awayMs()<SPLASH_COOLDOWN)state.screen='home';
markActive();setInterval(()=>{if(document.visibilityState==='visible')markActive()},15000);
const $=s=>document.querySelector(s);
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
/* ---- Haptics: Android/Chrome via navigator.vibrate; iOS 17.4+ Safari via hidden <input switch> tick ---- */
const HAP={tick:[8],light:[12],medium:[22],heavy:[38],success:[14,55,26],warn:[28,45,28],error:[38,40,38,40,38]};
let _hsw;
function hapSwitch(){if(_hsw!==undefined)return _hsw;try{const l=document.createElement('label');l.setAttribute('aria-hidden','true');l.style.cssText='position:fixed;left:-99px;top:-99px;width:1px;height:1px;opacity:0;pointer-events:none';const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');i.tabIndex=-1;l.appendChild(i);document.body.appendChild(l);_hsw=l}catch(_){_hsw=null}return _hsw}
function haptic(kind){try{if(data&&data.settings&&data.settings.haptics===false)return;const p=HAP[kind]||HAP.light;if(navigator.vibrate){navigator.vibrate(p);return}const l=hapSwitch();if(!l)return;let t=0;p.forEach((v,i)=>{if(i%2===0)setTimeout(()=>l.click(),t);t+=v})}catch(_){}}
const HAP_MAP={start:'medium',nav:'tick',subject:'light',notebook:'light','open-set':'light','open-recent':'light','open-book':'light',question:'tick',tab:'tick',filter:'tick','analysis-filter':'tick',next:'tick',prev:'tick',back:'tick',option:'tick','toggle-setting':'medium','set-theme':'medium','rem-toggle':'medium','td-toggle':'light','toggle-chapter':'light','toggle-revision':'light','myday-inc':'light','myday-dec':'light','myday-del':'warn','td-del':'warn','td-clear':'warn','pd-del':'warn','remove-tag':'warn','delete-set':'warn','delete-notebook':'warn','delete-chapter':'warn','delete-book':'warn','reset-data':'heavy'};
function hapFor(a,b){if(a==='mark-status'){const v=Number(b.dataset.status)||0;haptic(v===1?'success':v===3?'warn':v===2?'medium':'light');return}const k=HAP_MAP[a];if(k)haptic(k)}
function toast(t){try{if(/🎉/.test(t))haptic('success');else if(/^(Enter |Use a time|Invalid|Unsupported|Nothing to|That notebook|A notebook|Name cannot|Create a )/.test(t))haptic('error')}catch(_){}const x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('show'),1800)}
function go(screen,extra={}){Object.assign(state,extra,{screen});render();window.scrollTo({top:0,behavior:'instant'})}
function subjects(){return Object.keys(data.subjects)}
function paceInfo(sets){
 if(!sets||!sets.length)return null;
 let left=0,total=0;const stamps=[];
 sets.forEach(x=>{const q=Number(x.questions)||0;total+=q;left+=Math.max(0,q-(Number(x.solved)||0));(x.q||[]).forEach(v=>{if((Number(v.status)||0)===1&&v.doneAt)stamps.push(v.doneAt)})});
 if(!total)return null;
 if(left<=0)return {done:true};
 if(!stamps.length)return {wait:true};
 const mid=t=>{const d=dayShift(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
 const today=mid(Date.now());
 const first=mid(Math.min.apply(null,stamps));
 const age=Math.round((today-first)/864e5)+1;
 if(age<3)return {wait:true};
 const span=Math.min(14,age);
 const cutoff=new Date(today.getFullYear(),today.getMonth(),today.getDate()-(span-1));
 const recent=stamps.filter(t=>mid(t)>=cutoff).length;
 if(!recent)return {stalled:true};
 const pace=recent/span;
 const days=Math.ceil(left/pace);
 const end=new Date(today.getFullYear(),today.getMonth(),today.getDate()+days);
 return {pace:pace,days:days,end:end,left:left};
}
function paceLine(sets){
 const p=paceInfo(sets);if(!p)return '';
 if(p.done)return '<span class="paceLine ok">✓ All solved</span>';
 if(p.wait)return '<span class="paceLine mute">⏱ Pace: needs 3 days of data</span>';
 if(p.stalled)return '<span class="paceLine warn">⏱ No progress in the last 2 weeks</span>';
 const r=p.pace>=10?Math.round(p.pace):Math.round(p.pace*10)/10;
 const dt=p.days>365?'over a year':p.end.toLocaleDateString(undefined,{day:'numeric',month:'short'});
 return `<span class="paceLine">⏱ ${r}/day · done by ${dt}</span>`;
}
function paceWidget(rows){
 if(!rows.length)return '';
 const items=rows.map(([label,sets])=>({label,html:paceLine(sets)})).filter(x=>x.html);
 if(!items.length)return '';
 return `<div class="card paceWidget"><div class="paceWidgetHead">Pace forecast<small>Based on your last 2 weeks</small></div>${items.map(x=>`<div class="paceWidgetRow"><span>${esc(x.label)}</span>${x.html}</div>`).join('')}</div>`;
}
function subjectSets(sub){return Object.values(data.sets||{}).filter(x=>x.subject===sub)}
function subjectStats(s){
 const sets=Object.values(data.sets||{}).filter(x=>x.subject===s);
 const questions=sets.reduce((n,x)=>n+(Number(x.questions)||0),0);
 const solved=sets.reduce((n,x)=>n+(Number(x.solved)||0),0);
 const notebooks=new Set(sets.map(x=>x.notebook||'Ungrouped')).size;
 const progress=questions?Math.round(solved/questions*100):0;
 return {questions,solved,notebooks:(data.notebooks[s]||[]).length,progress};
}
function subjectCard(s){const x=data.subjects[s],m=subjectStats(s),c='var(--red)';return `<button class="card subject" data-action="subject" data-subject="${s}"><div class="subjectIcon" style="background:${c}22;border-color:${c}55;color:${c}">${x.icon}</div><div class="subjectText"><b>${s}</b><span>${m.notebooks} notebooks · ${m.questions} questions</span><div class="miniBar"><i style="width:${m.progress}%;background:${c}"></i></div></div><div class="subjectPct" style="color:${c}">${m.progress}%</div></button>`}
function bottom(active){return `<nav class="bottom">${[['home','⌂','Home'],['myday','✦','My Day'],['tracker','⌁','Tracker'],['settings','⚙','Settings']].map(([id,ic,t])=>`<button class="navBtn ${active===id?'active':''}" data-action="nav" data-nav="${id}"><span>${ic}</span>${t}</button>`).join('')}</nav>`}
const THEMES=[
 {id:'midnight-crimson',name:'Midnight Crimson',mode:'Dark',swatch:['#050a14','#ff2448','#238cff']},
 {id:'deep-ocean',name:'Deep Ocean',mode:'Dark',swatch:['#04101a','#16d6a0','#2396d2']},
 {id:'glacier-blue',name:'Glacier Blue',mode:'Light',swatch:['#d9ebf5','#238cff','#ff2448']},
 {id:'sunrise-coral',name:'Sunrise Coral',mode:'Light',swatch:['#fbe4d8','#ff2448','#ffb83d']}
];
function applyTheme(){const id=data.settings?.theme||'midnight-crimson';document.documentElement.dataset.theme=id;const t=THEMES.find(x=>x.id===id);const mc=document.querySelector('meta[name="theme-color"]');if(mc&&t)mc.setAttribute('content',t.swatch[0]);}
function render(){const shell=$('#shell');let html='';
 applyTheme();
 if(state.screen==='splash')html=splash();
 else if(state.screen==='home')html=home();
 else if(state.screen==='tracker')html=tracker();
 else if(state.screen==='subject')html=subject();
 else if(state.screen==='notebook')html=notebook();
 else if(state.screen==='set')html=setScreen();
 else if(state.screen==='question')html=question();
 else if(state.screen==='analysis')html=analysis();
 else if(state.screen==='myday')html=myDayScreen();
 else if(state.screen==='settings')html=settings();
 else if(state.screen==='referenceBook')html=referenceBookScreen();
 shell.innerHTML=html;document.body.classList.toggle('noMotion',data.settings?.animations===false);

 if(state.screen!=='splash')shell.insertAdjacentHTML('beforeend',bottom(state.screen==='subject'||state.screen==='notebook'||state.screen==='set'||state.screen==='question'||state.screen==='analysis'?'tracker':state.screen));
}

const LG={

'deep-ocean':{d1:'#0e3a56',d2:'#04101a',r1:'#d8f6ff',r2:'#3aa6c8',c1:'#ffe27a',c2:'#e69a1c',ed:'#8a5a10',bs:'#5a3a12',ar:'#22e0ae'},
'glacier-blue':{d1:'#5cc3ff',d2:'#1556a0',r1:'#ffffff',r2:'#a9d8f5',c1:'#ffe680',c2:'#ffab1f',ed:'#a86300',bs:'#0b2a52',ar:'#ffffff'},
'sunrise-coral':{d1:'#ffb04a',d2:'#ff5a3c',r1:'#ffffff',r2:'#ffd0b0',c1:'#ffffff',c2:'#ffe3c2',ed:'#a8341c',bs:'#7a2210',ar:'#6e1f0f'}

 if(kind==='glyph')return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 16 120 146" width="17" height="21" aria-hidden="true">${defs}${glyph}</svg>`;

function splash(){return `<section class="screen splash"><div class="logo">${jeetLogo('mark','s')}</div><h1>JEE<br><span>Question</span> Tracker</h1><div class="tagline">Track&nbsp; · &nbsp;Revise&nbsp; · &nbsp;Crack It</div><button class="get" data-action="start">Get Started →</button><div class="micro">Better tracking. Higher goals.</div></section>`}

function computedOverview(){
 const all=Object.values(data.sets||{});const total=all.reduce((n,x)=>n+(Number(x.questions)||0),0);const solved=all.reduce((n,x)=>n+(Number(x.solved)||0),0);
 const left=all.reduce((n,x)=>n+(x.q||[]).filter(q=>(Number(q.status)||0)===0).length,0);
 const redo=all.reduce((n,x)=>n+(x.q||[]).filter(q=>(Number(q.status)||0)===2).length,0);
 const difficult=all.reduce((n,x)=>n+(x.q||[]).filter(q=>(Number(q.status)||0)===3).length,0);

}
function recentRows(limit=4){

function statusLabel(st){return st===1?'✓ Done':st===2?'↻ Redo':st===3?'◉ Difficult':'○ Left'}
function home(){

function greet(){const h=new Date().getHours();return h<12?'GOOD MORNING,':h<17?'GOOD AFTERNOON,':'GOOD EVENING,'}
function nudge(o){const lb=data.settings?.lastBackup;if(!o.total||(lb&&Date.now()-lb<7*864e5))return '';return `<button class="card action nudgeCard" data-action="quick-export" style="width:100%;margin-top:10px"><b>⚠ Back up your data</b><span>Last backup: ${lb?new Date(lb).toLocaleDateString():'never'} · tap to export</span></button>`}
function nbOptions(){return `<div class="sectionHead"><b>Notebook options</b></div><div class="refActions"><button class="secondary" data-action="rename-notebook">Rename notebook</button><button class="secondary" data-action="delete-notebook">Delete notebook</button></div>`}
function searchBody(){const t=(state.gsearch||'').trim().toLowerCase();if(!t)return `<div class="card" style="padding:18px;color:var(--nz4);font-size:11px">Search notebooks, sets, question text and topic tags.</div>`;const out=[];const row=(action,attrs,title,sub)=>`<button class="card book" data-action="${action}" ${attrs}><div class="bookIcon">▣</div><div class="bookText"><b>${esc(title)}</b><span>${esc(sub)}</span></div><div class="chev">›</div></button>`;
 Object.keys(data.notebooks).forEach(s=>(data.notebooks[s]||[]).forEach(n=>{if(String(n.name).toLowerCase().includes(t))out.push(row('notebook',`data-notebook="${esc(n.id)}" data-subject="${esc(s)}"`,n.name,'Notebook · '+s))}));
 Object.entries(data.sets).forEach(([k,x])=>{if((x.name+' '+x.notebook+' '+x.subject).toLowerCase().includes(t))out.push(row('open-set',`data-key="${esc(k)}"`,x.name,`${x.subject} · ${x.notebook} · ${x.questions} questions`))});
 let hits=0;Object.entries(data.sets).forEach(([k,x])=>(x.q||[]).forEach((q,i)=>{if(hits<25&&q&&((q.text||'').toLowerCase().includes(t)||(q.tags||[]).some(g=>String(g).toLowerCase().includes(t)))){hits++;out.push(row('open-recent',`data-key="${esc(k)}" data-q="${i+1}"`,`${x.name} · Q${i+1}`,(q.text||'').slice(0,60)||(q.tags||[]).join(', ')))}}));
 return out.length?out.join(''):`<div class="card" style="padding:18px;color:var(--nz4);font-size:11px">No results.</div>`}
function pdId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function myDayData(){if(!data.myDay||!Array.isArray(data.myDay.items))data.myDay={day:'',items:[],pastDue:[]};if(!Array.isArray(data.myDay.pastDue))data.myDay.pastDue=[];if(!Array.isArray(data.myDay.todos))data.myDay.todos=[];if(!data.myDay.rem)data.myDay.rem={on:false,time:'20:00',shown:''};const t=todayKey();if(data.myDay.day!==t){const prev=data.myDay.day;if(prev){data.myDay.items.forEach(i=>{if(!mdOn(i,new Date(prev+'T00:00:00').getDay()))return;const tg=Number(i.target)||0,dn=Number(i.done)||0;if(dn<tg){const left=tg-dn,ex=data.myDay.pastDue.find(p=>p.title===i.title);if(ex){ex.left+=left;ex.from=prev}else data.myDay.pastDue.push({id:pdId(),title:i.title,left:left,from:prev})}});data.myDay.pastDue=data.myDay.pastDue.slice(-40)}data.myDay.items=data.myDay.items.filter(i=>!i.once);data.myDay.items.forEach(i=>{i.done=0});data.myDay.day=t;save()}return data.myDay}
function mdKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function mdOn(i,dow){return !Array.isArray(i.days)||!i.days.length||i.days.includes(dow)}
function mdFmt(t){const [h,m]=String(t).split(':').map(Number);return (h%12||12)+':'+String(m||0).padStart(2,'0')+(h<12?' AM':' PM')}
const MD_IC={link:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>',rep:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>',open:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>'};
function mdMeta(i){const id=esc(i.id),ln=i.link&&data.sets[i.link],dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const rp=Array.isArray(i.days)&&i.days.length?i.days.map(v=>dn[v]).join(' · '):'Daily';
 return `<div class="mdMeta">${ln?`<button class="mdTag linked" data-action="open-set" data-key="${esc(i.link)}">${MD_IC.open}<span>${esc(ln.name)}</span></button><button class="mdTag ghost" data-action="myday-link" data-id="${id}">Change</button>`:`<button class="mdTag ghost" data-action="myday-link" data-id="${id}">${MD_IC.link}<span>Link a set</span></button>`}<button class="mdTag ghost" data-action="myday-repeat" data-id="${id}">${MD_IC.rep}<span>${rp}</span></button></div>`}
function mdLink(key,p,n){if(p===n||(p!==1&&n!==1))return;myDayData().items.forEach(i=>{if(i.link===key){const d=Number(i.done)||0;i.done=n===1?d+1:Math.max(0,d-1)}})}
function mdTodos(){const t=myDayData().todos;return `<div class="card sgBox"><div class="sgHead"><div><b>Checklist</b><span>${t.filter(x=>x.done).length}/${t.length} done · for things that aren't counts</span></div>${t.some(x=>x.done)?'<button class="sgAll" data-action="td-clear">Clear done</button>':''}</div>${t.map(x=>`<div class="sgRow"><button class="tdBox ${x.done?'on':''}" data-action="td-toggle" data-id="${esc(x.id)}">${x.done?'✓':''}</button><div class="sgInfo"><b style="${x.done?'text-decoration:line-through;opacity:.5':''}">${esc(x.text)}</b></div><button class="pdX" data-action="td-del" data-id="${esc(x.id)}" aria-label="Delete">✕</button></div>`).join('')}<button class="mdAddBig" style="margin-top:8px" data-action="td-add">＋ Add item</button></div>`}
function mdRemCard(){const r=myDayData().rem;return `<div class="card sgBox"><div class="sgHead"><div><b>⏰ Reminder</b><span>${r.on?'Nudges you at '+mdFmt(r.time)+' if anything is unfinished':'Off'}</span></div><button class="sgAll" data-action="rem-toggle">${r.on?'Turn off':'Turn on'}</button></div>${r.on?`<button class="mdTag ghost" data-action="rem-time">Change time · ${mdFmt(r.time)}</button>`:''}<small style="display:block;margin-top:8px;font-size:9px;color:var(--nz4)">Works while the app is open or in the background.</small></div>`}
function mdOpen(){const md=myDayData(),dw=dayShift().getDay();return md.items.filter(i=>mdOn(i,dw)&&(Number(i.done)||0)<(Number(i.target)||1)).length+md.todos.filter(x=>!x.done).length}
function mdRemBanner(){const r=myDayData().rem,n=new Date(),[h,m]=String(r.time).split(':').map(Number),o=mdOpen();if(!r.on||!o||n.getHours()*60+n.getMinutes()<h*60+m)return '';return `<div class="card sgBox" style="border-color:var(--gold)"><b style="font-size:13px">⏰ ${o} thing${o>1?'s':''} still open today</b></div>`}
function mdRemTick(){try{const md=myDayData(),r=md.rem,n=new Date(),[h,m]=String(r.time).split(':').map(Number);if(!r.on||r.shown===todayKey()||n.getHours()*60+n.getMinutes()<h*60+m)return;r.shown=todayKey();save();const o=mdOpen();if(!o)return;const msg=o+' thing'+(o>1?'s':'')+' still open today';toast('⏰ '+msg);if('Notification' in window&&Notification.permission==='granted')new Notification('My Day',{body:msg,icon:'icon-192.png'});if(state.screen==='myday')render()}catch(_){}}
setInterval(mdRemTick,60000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')mdRemTick()});
function myDayWidget(){const md=myDayData();const items=md.items.filter(i=>mdOn(i,dayShift().getDay()));const PAL=['#ff4d6d','#4aa7ff','#a78bfa','#f5b942','#22d3a5'];const tot=items.reduce((n,i)=>n+(Number(i.target)||0),0);const dn=items.reduce((n,i)=>n+Math.min(Number(i.done)||0,Number(i.target)||0),0);const td=md.todos,tdDone=td.filter(x=>x.done).length,units=items.length+td.length,frac=items.reduce((n,i)=>n+Math.min(1,(Number(i.done)||0)/(Number(i.target)||1)),0)+tdDone,p=units?Math.round(frac/units*100):0,tp=tot?Math.round(dn/tot*100):0,cp=td.length?Math.round(tdDone/td.length*100):0;const cmp=items.filter(i=>(Number(i.done)||0)>=(Number(i.target)||1)).length;const dt=dayShift().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'});
const msg=!units?'Set your first target':(cmp===items.length&&tdDone===td.length)?'All done. Great day! 🎉':p>=50?'Over halfway, keep going':'Let\'s get started';
const hero=`<div class="card mdHero"><div class="mdHeroTop"><div class="mdHeroText"><div class="eyebrow">TODAY · ${esc(dt.toUpperCase())}</div><h2>${esc(msg)}</h2><p>${units?`${cmp+tdDone} of ${units} done today`:'Plan your day, one target at a time'}</p></div><div class="ring" style="--pct:${p}%"><div><b>${p}%</b><span>Done</span></div></div></div><div class="mdStats"><div class="mdStat"><div class="mdStatTop"><span>Progress</span><b>${items.length?`${cmp}/${items.length}`:'–'}</b></div><div class="mdStatBar"><i style="width:${tp}%"></i></div><small>${tot?`${dn} of ${tot} questions`:'No targets yet'}</small></div><div class="mdStat chk"><div class="mdStatTop"><span>Checklist</span><b>${td.length?`${tdDone}/${td.length}`:'–'}</b></div><div class="mdStatBar"><i style="width:${cp}%"></i></div><small>${td.length?`${td.length-tdDone} left`:'No items yet'}</small></div></div></div>`;
const list=items.length?items.map((i,idx)=>{const t=Number(i.target)||1,d=Number(i.done)||0,pc=Math.min(100,Math.round(d/t*100)),c=PAL[idx%PAL.length],ok=d>=t,id=esc(i.id);return `<div class="mdItem ${ok?'complete':''}" style="--c:${ok?'#1fbf8f':c}"><div class="mdTop"><div class="mdRing" style="--p:${pc}%"><span>${ok?'✓':pc+'%'}</span></div><button class="mdInfo" data-action="myday-set" data-id="${id}"><b>${esc(i.title)}</b><small>${d} of ${t} · ${ok?'Completed':Math.max(0,t-d)+' left'}</small></button><button class="mdDel" data-action="myday-del" data-id="${id}" aria-label="Delete">✕</button></div><div class="mdBar"><i style="width:${pc}%"></i></div>${mdMeta(i)}<div class="mdBtns"><button class="mdBtn ghost" data-action="myday-dec" data-id="${id}">−1</button><button class="mdBtn" data-action="myday-inc" data-id="${id}" data-step="1">+1</button><button class="mdBtn" data-action="myday-inc" data-id="${id}" data-step="5">+5</button><button class="mdBtn" data-action="myday-inc" data-id="${id}" data-step="10">+10</button></div></div>`}).join(''):`<div class="card mdEmpty"><div class="mdEmptyIcon">✦</div><b>Nothing planned yet</b><span>Add a target for today, or start with one of these</span><div class="mdChips">${['Solve 20 questions','Revise 1 chapter','Do 1 mock test'].map(x=>`<button class="mdChip" data-action="myday-add" data-title="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`;
const pd=md.pastDue||[];const pdFmt=k=>{const d=new Date(k+'T00:00:00');return isNaN(d)?k:d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})};
const pdHtml=pd.length?`<div class="card pdBox"><div class="pdHead"><div><b>Past due</b><span>${pd.length} unfinished from earlier days</span></div><button class="pdAll" data-action="pd-all">Add all</button></div>${pd.map(x=>`<div class="pdRow"><div class="pdInfo"><b>${esc(x.title)}</b><small>${Number(x.left)||0} left · from ${esc(pdFmt(x.from))}</small></div><button class="pdBtn" data-action="pd-add" data-id="${esc(x.id)}">Add today</button><button class="pdX" data-action="pd-del" data-id="${esc(x.id)}" aria-label="Dismiss">✕</button></div>`).join('')}</div>`:'';
return `${hero}${mdRemBanner(items)}${pdHtml}${list}<button class="mdAddBig" data-action="myday-add">＋ Add a target</button>${mdTodos()}${mdRemCard()}`}
function myDayScreen(){return `<section class="screen">${header('My Day','Your own targets for today')}${myDayWidget()}</section>`}

function handle(e){const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;hapFor(a,b);
 if(a==='start'){go('home');return}
 if(a==='nav'){const n=b.dataset.nav;if(n==='home')go('home');else if(n==='tracker')go('tracker',{notebook:null,setKey:null,gsearch:''});else if(n==='myday')go('myday');else go('settings');return}
 if(a==='subject'){go('subject',{subject:b.dataset.subject,from:state.screen,notebook:null,setKey:null,search:''});return}
 if(a==='pd-add'||a==='pd-all'||a==='pd-del'){const md=myDayData();const ids=a==='pd-all'?md.pastDue.map(x=>x.id):[b.dataset.id];const add=a!=='pd-del';md.pastDue.filter(x=>ids.includes(x.id)).forEach(x=>{if(!add)return;const ex=md.items.find(i=>i.once&&i.title===x.title);if(ex)ex.target=(Number(ex.target)||0)+x.left;else md.items.push({id:pdId(),title:x.title,target:x.left,done:0,once:true})});md.pastDue=md.pastDue.filter(x=>!ids.includes(x.id));save();render();toast(add?'Added to today':'Dismissed');return}
 if(a==='td-add'){const t=prompt('Checklist item');if(!t||!t.trim())return;myDayData().todos.push({id:pdId(),text:t.trim().slice(0,80),done:false});save();render();return}
 if(a==='td-toggle'){const x=myDayData().todos.find(v=>v.id===b.dataset.id);if(x){x.done=!x.done;save();render()}return}
 if(a==='td-del'){const md=myDayData();md.todos=md.todos.filter(v=>v.id!==b.dataset.id);save();render();return}
 if(a==='td-clear'){const md=myDayData();md.todos=md.todos.filter(v=>!v.done);save();render();return}
 if(a==='rem-toggle'){const r=myDayData().rem;r.on=!r.on;r.shown='';if(r.on&&'Notification' in window&&Notification.permission==='default')try{Notification.requestPermission()}catch(_){}save();render();return}
 if(a==='rem-time'){const r=myDayData().rem;const v=prompt('Remind me at (24h, e.g. 20:30)',r.time);if(v===null)return;const mt=v.trim().match(/^([01]?\d|2[0-3]):([0-5]\d)$/);if(!mt){toast('Use a time like 20:30');return}r.time=mt[1].padStart(2,'0')+':'+mt[2];r.shown='';save();render();toast('Reminder set');return}
 if(a==='myday-link'){const it=myDayData().items.find(x=>x.id===b.dataset.id);if(!it)return;const keys=Object.keys(data.sets);if(!keys.length){toast('Create a question set first');return}const raw=prompt('Link to which set? Solved questions in it count automatically.\n0 = none\n'+keys.map((k,n)=>(n+1)+' = '+data.sets[k].name+' ('+data.sets[k].subject+')').join('\n'));if(raw===null||!raw.trim())return;const n=Math.floor(Number(raw));if(n===0)delete it.link;else if(keys[n-1])it.link=keys[n-1];else{toast('Pick a number from the list');return}save();render();return}
 if(a==='myday-repeat'){const it=myDayData().items.find(x=>x.id===b.dataset.id);if(!it)return;const raw=prompt('Repeat on which days?\n0=Sun 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat\nType e.g. 1,3,5 — or "all" for every day',Array.isArray(it.days)?it.days.join(','):'all');if(raw===null)return;const d=[...new Set(raw.split(/[^0-9]+/).filter(x=>/^[0-6]$/.test(x)).map(Number))].sort();if(!d.length||d.length>=7||raw.trim().toLowerCase()==='all')delete it.days;else it.days=d;save();render();toast('Schedule updated');return}
 if(a==='myday-add'){const title=b.dataset.title||prompt('Target name (e.g. Revise formulas)');if(!title||!title.trim())return;const raw=prompt('Target count for today (e.g. 20)','10');if(raw===null)return;const n=Math.floor(Number(raw));if(!Number.isFinite(n)||n<1||n>9999){toast('Enter a number from 1 to 9999');return}const md=myDayData();md.items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:title.trim().slice(0,60),target:n,done:0});save();render();return}
 if(a==='myday-inc'||a==='myday-dec'||a==='myday-set'||a==='myday-del'){const md=myDayData();const it=md.items.find(x=>x.id===b.dataset.id);if(!it)return;const before=Number(it.done)||0;if(a==='myday-del'){if(!confirm('Delete "'+it.title+'"?'))return;md.items=md.items.filter(x=>x!==it)}else if(a==='myday-inc'){it.done=before+(Number(b.dataset.step)||1)}else if(a==='myday-dec'){it.done=Math.max(0,before-1)}else{const raw=prompt('Done so far (target '+it.target+')',String(before));if(raw===null)return;const n=Math.floor(Number(raw));if(!Number.isFinite(n)||n<0||n>99999){toast('Enter a valid number');return}it.done=n}save();render();if(a!=='myday-del'&&before<it.target&&(Number(it.done)||0)>=it.target)toast('Target complete 🎉');return}
