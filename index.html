/* ---- App Lock PIN pad (follows every theme through --acc1 / --nz*) ---- */
.pinWrap{display:flex;flex-direction:column;align-items:center;margin-top:6px;width:100%;max-width:292px}
.splash .pinWrap{animation:splashUp .5s cubic-bezier(.22,.9,.3,1) .16s both}
.pinBadge{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 13px;border-radius:99px;font-size:10.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--acc1);background:color-mix(in srgb,var(--acc1) 12%,transparent);border:1px solid color-mix(in srgb,var(--acc1) 34%,transparent)}
.pinDots{display:flex;gap:16px;margin:20px 0 10px;height:16px}
.pinDots i{width:13px;height:13px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--nz5) 38%,transparent);background:transparent;transition:background .14s,border-color .14s,box-shadow .14s,transform .14s}
.pinDots i.on{background:var(--acc1);border-color:var(--acc1);box-shadow:0 0 12px var(--acc1);transform:scale(1.12)}
.pinMsg{min-height:18px;font-size:12.5px;font-weight:600;letter-spacing:.2px;color:var(--nz4);transition:color .15s}
.pinMsg.err{color:#ff6b7d}.pinMsg.ok{color:#4be3a8}
.pinGrid{display:grid;grid-template-columns:repeat(3,72px);gap:13px 20px;margin-top:20px;justify-content:center}
.pinKey{width:72px;height:72px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--nz5);border:1px solid color-mix(in srgb,var(--nz5) 14%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--nz5) 11%,transparent),color-mix(in srgb,var(--nz5) 3%,transparent));-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--nz5) 16%,transparent),0 8px 20px -10px rgba(0,0,0,.6);-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .09s,background .12s,border-color .12s,box-shadow .12s}
.pinKey b{font-size:27px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.pinKey span{display:block;font-size:8px;font-weight:700;letter-spacing:2px;color:var(--nz4);height:9px;line-height:9px;padding-left:2px}
.pinKey:active{transform:scale(.9);background:color-mix(in srgb,var(--acc1) 30%,transparent);border-color:var(--acc1);box-shadow:0 0 22px color-mix(in srgb,var(--acc1) 45%,transparent)}
.pinText{background:transparent;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;font-size:13px;font-weight:700;color:var(--nz4)}
.pinText:active{background:color-mix(in srgb,var(--nz5) 10%,transparent);border-color:transparent;box-shadow:none}
.pinGhost{visibility:hidden;pointer-events:none}
.pinWrap.shake .pinDots{animation:pinShake .5s cubic-bezier(.36,.07,.19,.97)}
.pinWrap.shake .pinDots i{border-color:#ff6b7d;background:#ff6b7d;box-shadow:0 0 12px #ff6b7d}
.pinWrap.ok .pinDots i{border-color:#4be3a8;background:#4be3a8;box-shadow:0 0 14px #4be3a8}
@keyframes pinShake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
.noMotion .pinWrap.shake .pinDots{animation:none}
.splash.locked .logo{width:128px;height:128px;margin-bottom:8px}
.splash.locked h1{font-size:32px}
.splash.locked .tagline{margin-bottom:6px}
.splash.locked{padding-bottom:64px}
@media (max-height:700px){.splash.locked .logo{width:96px;height:96px}.pinKey{width:64px;height:64px}.pinGrid{grid-template-columns:repeat(3,64px);gap:10px 18px;margin-top:14px}.pinDots{margin:14px 0 8px}.splash.locked h1{font-size:28px}.pinKey b{font-size:24px}}
.pinOverlay{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:pinFade .2s ease}
.pinCard{width:min(340px,100%);padding:24px 18px 22px;border-radius:26px;display:flex;flex-direction:column;align-items:center;background:linear-gradient(160deg,rgba(var(--bgRgb2),.98),rgba(var(--bgRgb),.99));border:1px solid color-mix(in srgb,var(--acc1) 30%,transparent);box-shadow:0 30px 70px -10px rgba(0,0,0,.7),0 0 40px -12px var(--acc1)}
.pinTitle{font-size:18px;font-weight:800;color:var(--nz5);margin-bottom:3px}

.pinCard .pinWrap{margin-top:0}
@keyframes pinFade{from{opacity:0}to{opacity:1}}

const HELP_SECS=[
['🚀',"Getting started","<p>Open the app and tap <b>Get Started</b> on the welcome screen. If you have questions saved, it shows a welcome-back line with your overall % and how many you've solved. If App Lock is on, you enter your 4-digit PIN here first.</p>\n<p>The bottom bar has four tabs: <b>Home</b> (summary), <b>My Day</b> (today's own targets), <b>Tracker</b> (subjects, notebooks, sets, questions) and <b>Settings</b>.</p>\n<p>Everything is saved on your device automatically after every change. There is no save button. You can use the app offline once it has loaded, and it can be added to your phone's home screen like an app. Nothing leaves your device unless you export a backup, use Share, or sign in to cloud sync.</p>"],
['🏠',"Home screen","<p>Home is a summary. In the Classic layout, from top to bottom:</p>\n<ul><li><b>Hero:</b> greeting, your name and the overall progress ring (solved ÷ total questions).</li>\n<li><b>Total Questions / Solved / Remaining:</b> across every set.</li>\n<li><b>Overall Progress card:</b> progress bar, solved and remaining, plus how many notebooks and question sets you have.</li>\n<li><b>Redo / Difficult / Viewed today / Done today:</b> Redo and Difficult are questions currently marked that way. Viewed today is questions you opened today. Done today is questions you marked Done today.</li>\n<li><b>Weekly insights button:</b> opens the week analysis screen.</li>\n<li><b>Exam countdown:</b> days left to your exam (only if switched on and a date is set in Settings).</li>\n<li><b>Insights card:</b> today's total (Tracker plus My Day) against your daily goal, your fastest hours over the last 30 days, this week vs last week (Tracker questions), and your weakest subject (can be switched off in Settings).</li>\n<li><b>Back up reminder:</b> appears if you have data and haven't exported a backup in 7 days. Tap it to export.</li>\n<li><b>Subjects:</b> a card per subject with its progress ring. Tap to open it. \"View all\" goes to Tracker.</li>\n<li><b>Quick Actions:</b> Import and Export a JSON backup.</li>\n<li><b>Recent Activity:</b> the last 3 questions you opened, with their status. Tap one to jump straight to it.</li></ul>\n<p>The day on Home (Done today, Viewed today) rolls over at your Day Reset time, not midnight. See Settings below.</p>"],
['🧩',"Home layouts (Settings → Appearance)","<p>The <b>Layout</b> picker only rearranges the Home screen. All the same information and buttons are there.</p>\n<ul><li><b>Classic:</b> the original arrangement described above.</li>\n<li><b>Focus:</b> a big centred ring with the overall %, three numbers (Today, Left, Redo) and one slim coloured bar per subject.</li>\n<li><b>Bento:</b> a tile grid. A large Overall % tile, Left and Today tiles, a My Day tile (tap to open My Day), then a tinted tile per subject.</li>\n<li><b>Today first:</b> opens with today only. Tracker (questions you marked Done today against your daily target) and My Day (questions done against your My Day total) sit side by side, then the My Day items still open, then Overall and Subjects.</li></ul>\n<p>The Weekly insights button, Quick Actions and Recent Activity are in every layout. If you chose an old layout name from an earlier version you are put back on Classic.</p>"],
['📚',"Tracker: subjects, notebooks, sets","<p>The structure is <b>Subject → Notebook → Set → Question</b>.</p>\n<ul><li><b>Subject:</b> Physics, Chemistry and Mathematics. Tap one to see its Questions, Solved and Progress, its notebooks and its ungrouped sets.</li>\n<li><b>Notebook:</b> a folder for a source such as a book or module. Create one with <b>＋ New Notebook</b> (names must be unique inside a subject). Inside it you can rename or delete it. Deleting a notebook deletes all its sets.</li>\n<li><b>Set:</b> one chapter or exercise. Create with <b>＋ New Set</b>: enter a name, then the number of questions (1 to 5000). Created inside a notebook it belongs to that notebook. Created from the subject screen it goes under <b>Ungrouped Sets</b>.</li>\n<li><b>Question:</b> numbered 1 to N. Each has a status, a Revision flag and optional topic tags.</li></ul>\n<p>The Tracker tab also has a <b>search box</b> (notebooks, sets, question text and topic tags) and a <b>Pace forecast</b> built from your last 2 weeks, shown for Overall and each subject.</p>"],
['🔢',"Inside a set","<p>The top shows five tiles: Total, Solved, Revision, Difficult and Remaining, and a % complete bar. There are two tabs.</p>\n<p><b>Questions tab:</b> filter chips All, Left, Done, Redo, Difficult (with counts), plus Parked when the set has parked questions. <b>Continue · Q#</b> reopens the last question you looked at. The grid below lists question numbers; tap one to open it.</p>\n<p><b>Analysis tab:</b> counts for Done, Left, Revision and Difficult, plus three views. <b>Overview</b> (performance snapshot and recently opened questions), <b>Status</b> (Left, Done, Redo, Difficult) and <b>Topics</b> (percentage done per topic tag; empty until you add tags).</p>\n<p><b>Set options:</b> <b>Rename</b>, <b>Edit count</b> (change the number of questions; if shrinking would remove questions that have progress, notes or tags, it asks before removing them), and <b>Delete</b> (asks first and mentions Restore Previous Data).</p>\n<p><b>Park remaining / Unpark:</b> use this when you decide to skip the rest of a set for now. Every question still marked Left (not Redo, Difficult or Revision) is parked. Parked questions keep their numbers, look faded with a dashed border and are listed under the <b>Parked</b> chip. They stop counting in Total, Remaining, % complete, the pace forecast, and every screen, share and report, so a set you finished selectively can read 100%. <b>Unpark</b> brings them all back and they count again straight away.</p>"],
['✅',"Marking a question","<p>Open a question to see its set, number, current status and set progress. Tap a status:</p>\n<ul><li><b>○ Left:</b> not done yet (the default).</li><li><b>✓ Done:</b> solved. Counts toward Solved, Done today and your study target. The time you did it is recorded for the weekly chart and Insights.</li>\n<li><b>↻ Redo:</b> solve again later.</li><li><b>◉ Difficult:</b> needs extra work.</li>\n<li><b>⏸ Park:</b> shown on a Left question. It parks just this question so it stops counting until you tap <b>Unpark</b>. Marking it Done, Redo, Difficult or Revision unparks it automatically.</li></ul>\n<p>Changing a question away from Done removes it from today's count. <b>▣ Revision</b> is a separate flag you can switch on or off at any time, whatever the status. <b>＋ Add Topic</b> adds a tag (for example Organic or Calculus); tap a tag's × to remove it. <b>← Prev</b> and <b>Next →</b> move through questions, and <b>Back to set</b> returns to the grid.</p>\n<p>If a My Day target is linked to this set, marking Done raises that target's count by 1 and undoing it lowers it by 1.</p>"],
['✦',"My Day","<p>My Day is for your own targets today, such as module homework you must finish. It is separate from your tracker questions and from the study target.</p>\n<ul><li><b>＋ Add a target:</b> name it and give a count (1 to 9999). Use <b>+1 / +5 / +10</b> and <b>−1</b>, or tap the target's name to type the exact number done. Finishing one shows \"Target complete\".</li>\n<li><b>Link a set:</b> pick a question set so solving questions in it counts automatically. <b>Change</b> relinks it. Choose 0 to unlink. Tap the linked set's name to open it.</li>\n<li><b>Target tag:</b> shows the question count (for example ✎ Target 25). Tap it to change the number. For a repeating target you choose whether the new number applies every time from now on, or just today.</li>\n<li><b>Repeat tag:</b> shows Once, Daily or weekdays. Tap it to choose <i>once</i>, <i>all</i> (every day) or days (0=Sun … 6=Sat, for example 1,3,5).</li>\n<li><b>Rebase:</b> for a target that is part done (for example 5/20), it becomes 0/15 and keeps the 5 as already banked, so your progress isn't lost.</li>\n<li><b>✕</b> deletes a target.</li></ul>\n<p><b>Carry-forward:</b> a one-time target you didn't finish moves to tomorrow with only what's left. A repeating target that you miss on a scheduled day goes to <b>Past due</b>, where you can <b>Add today</b>, <b>Add all</b> or dismiss with ✕.</p>\n<p><b>Checklist:</b> add plain to-do items, tick them, and <b>Clear done</b>. They have no question count.</p>\n<p><b>Reminder:</b> turn on, then <b>Change time</b>. After that time, if anything is still open, you get a banner, a message, and a notification (if you allow notifications). It works while the app is open or in the background.</p>\n<p>The top card shows the ring and a line like \"16 of 78 questions done today\", the target Progress bar (targets finished) and the Checklist bar. The ring follows questions done against all your question targets. If you have only a checklist, it follows the checklist.</p>"],
['🎯',"Study target","<p>In Settings → <b>Today's Study Target</b> you set the number of questions you want to solve each day. Tap <b>Change target</b> (1 to 1000).</p>\n<p>It counts only questions you mark <b>Done</b> in the tracker today. My Day work is never added to it, so your reference-book analysis stays clean. It resets at your Day Reset time.</p>\n<p>The weekly study target on the Insights screen is this daily number × 7.</p>"],
['📊',"Weekly insights screen","<p>Open it from the <b>Weekly insights</b> button on Home. It covers Monday to Sunday of the current week (the week and the day follow your Day Reset time).</p>\n<ul><li><b>Weekly study target:</b> tracker questions solved this week out of daily target × 7, with a % bar, \"Day X of 7\" and how many days you reached your daily target.</li>\n<li><b>Each day:</b> a stacked bar per day. The bottom colour is Tracker, the top colour is My Day. The dashed line is your daily target.</li>\n<li><b>Heavy My Day note:</b> appears for a day with 0 Tracker questions but some My Day questions, so a busy My Day doesn't look like an empty day.</li>\n<li><b>Tracker, week / My Day, week:</b> the two weekly totals.</li></ul>\n<p>Tracker totals come from the times your questions were marked Done. My Day totals for each day are saved at the end of that day, so My Day history starts from when this feature was added, and earlier days show Tracker only.</p>"],
['📤',"Sharing progress","<p>Settings → <b>Share progress</b> (also the Share button in the daily reminder) opens one sheet.</p>\n<ul><li><b>Today / Yesterday:</b> Yesterday uses the saved summary from the last day you used the app. It is only available as a Message.</li>\n<li><b>What you did:</b> two equal tiles, Tracker and My Day (Today only).</li>\n<li><b>Send as:</b> <b>Card</b> (a picture with the date, your total questions, the Tracker and My Day tiles, Solved/Remaining/Redo/Difficult, overall progress and subjects; when you have My Day targets or finished checklist items, the card lists them instead of the subject bars), <b>Message</b> (text you can paste into any app, with each My Day target and its count, and each finished checklist item by name) or <b>Email</b> (a full report with subject, to your saved address, with the same target and checklist lists).</li>\n<li><b>Preview and Send:</b> you see exactly what will go out. Card opens your phone's share options, or saves the image if sharing isn't available. Message opens share options with the text. Email opens your email app.</li></ul>\n<p><b>Daily share reminder</b> (Settings → Share): switch on, add your <b>Email address</b> and choose a <b>Reminder time</b>. At that time each evening the app offers a Share button or Later.</p>"],
['📖',"Reference Library","<p>Settings → <b>Reference Library</b> tracks books chapter by chapter. It is separate from question sets.</p>\n<ul><li><b>Add book:</b> name, author or publisher (optional), subject (Physics, Chemistry, Mathematics or Other) and number of chapters or units.</li>\n<li>Each book tile shows its subject icon, a % ring, a progress bar and \"done / total chapters\". Tap to open it.</li>\n<li>Inside a book: <b>＋ Add Chapter</b>, tick a chapter done, ✎ rename it, × remove it. <b>Edit book</b> changes its details and <b>Update progress</b> adjusts it. Each chapter is independent.</li></ul>"],
['🔒',"Security (App Lock and PIN)","<ul><li><b>App Lock:</b> asks for a 4-digit PIN on the welcome screen before the app opens. Turning it on asks you to create the PIN. Turning it off asks for the current PIN.</li>\n<li><b>Change PIN:</b> enter the current PIN, then set a new one.</li>\n<li><b>Lock now:</b> returns to the welcome screen and locks immediately.</li></ul>\n<p>Too many wrong attempts makes you wait 30 seconds.</p><p><b>Recovery code:</b> when you create or change a PIN the app shows a one-time recovery code. Write it down. On the lock screen tap <b>Forgot PIN?</b>, enter the code, and App Lock turns off so you can set a new PIN. <b>Recovery code</b> in Settings makes a new one (it asks for your PIN first). Without a code, the only way back in is <b>Erase app data and start over</b> on that screen, which deletes everything on the device, so keep backups. Turning App Lock on for the first time makes you choose your own PIN.</p>"],
['🎨',"Appearance, Home and Feedback settings","<ul><li><b>Theme:</b> Ruby Noir, Amethyst Night, Onyx (pitch black with a lime accent) or Aqua (black-teal with bright cyan blue). A theme sets all the colours.</li>\n<li><b>Ambient Glow:</b> each tap changes the background light colour (Theme, Crimson, Ocean, Emerald, Gold, Violet, Bronze, Off).</li>\n<li><b>Liquid Glass:</b> frosted see-through cards and navigation.</li>\n<li><b>Compact Layout:</b> fits more notebooks and sets on screen.</li>\n<li><b>Motion Effects:</b> transitions and movement. Off for a still interface.</li>\n<li><b>Minimalist mode:</b> turns every screen jet black with white text and no colour, whichever theme is chosen. Switch it off to return to your theme's colours.</li>\n<li><b>New look:</b> glass cards, a floating bottom bar and softer glow. Turn it off for the original styling.</li>\n<li><b>Layout:</b> Classic, Focus, Bento or Today first for Home.</li>\n<li><b>Insights:</b> shows or hides the Insights card on Home.</li>\n<li><b>Exam Countdown:</b> set your exam date below the switch first, then turn it on to show days left on Home.</li>\n<li><b>Haptic Feedback:</b> a small vibration on taps, marking questions and completing targets (only on phones that support it). <b>Test vibration</b> sends a strong buzz so you can check; if nothing happens, make sure the phone isn't in silent or Do Not Disturb mode.</li>\n<li><b>Day Reset time:</b> 12 AM to 8 AM. Your \"today\" (Done today, study target, My Day) starts over at this hour. Handy if you study past midnight.</li></ul>"],
['💾',"Backup, restore and reset","<ul><li><b>Export JSON Backup:</b> saves a complete copy of notebooks, sets, books and settings, and records the backup date.</li>\n<li><b>Import JSON Backup:</b> choose a backup file. It <i>replaces everything</i> after you confirm.</li>\n<li><b>Restore Previous Data:</b> undoes the last import, reset or delete (one step back).</li>\n<li><b>Auto-backups:</b> the app keeps a copy of your data from the first time you open it each day, for the last 3 days. They appear under Data & Backup, and tapping one restores it.</li>\n<li><b>Two devices at once:</b> if your phone and laptop both changed data before syncing, the app combines them instead of letting one overwrite the other. A set or question you deleted on one device can come back from the other.</li>\n<li><b>Tracker Storage:</b> shows how much data is stored and the counts of questions, notebooks, sets and books.</li>\n<li><b>Reset Tracker Data:</b> deletes notebooks, sets and books from this device. It asks twice, and Restore Previous Data can bring it back.</li></ul>\n<p>Clearing your browser or app data erases the app's data, so keep backups. Export regularly. The Home reminder appears after 7 days without one.</p>\n<p><b>Cloud sync</b> (top of Settings): sign in with Google to keep a copy online. Changes upload shortly after you make them and when you leave the app. <b>Sync now</b> pulls the latest, <b>Restore previous cloud version</b> goes back one version, and <b>Sign out</b> stops syncing while keeping your data on the device. It needs an internet connection.</p>"],
['🧠',"How the numbers fit together","<ul><li><b>Study target and Done today</b> count tracker questions marked Done today. My Day is never added to them.</li>\n<li><b>Share and email totals</b> show Tracker and My Day separately, and Done today as the sum of both. A My Day target linked to a set doesn't count the same question twice.</li>\n<li><b>Parked questions</b> are left out of every total, % and pace forecast until you unpark them.</li>\n<li><b>My Day ring</b> follows questions, so it matches the \"x of y questions\" line under it.</li>\n<li><b>Hard Allen day?</b> If you did only module homework in My Day, your study target stays low but the Insights chart and the share card still show that work.</li>\n<li><b>Undo mistakes:</b> un-mark a question to remove it from today's count. For deleted sets, notebooks, imports or resets use Restore Previous Data.</li></ul>"],
['📘',"Words used in the app","<ul><li><b>Set:</b> a chapter or exercise with a number of questions.</li><li><b>Ungrouped:</b> a set not inside any notebook.</li>\n<li><b>Done / Redo / Difficult / Left:</b> the four question statuses.</li><li><b>Revision:</b> a flag for questions to revise, separate from status.</li><li><b>Parked:</b> a Left question you've set aside on purpose. It doesn't count in progress until you unpark it.</li>\n<li><b>Topic:</b> a tag you add to a question.</li><li><b>Target (My Day):</b> a goal with a count for today.</li>\n<li><b>Rebase:</b> turn a part-done target into a fresh one for what's left.</li><li><b>Past due:</b> repeating targets you missed on a scheduled day.</li>\n<li><b>Day Reset:</b> the hour your day starts over.</li><li><b>Pace forecast:</b> an estimate of when you'd finish at your last 2 weeks' speed.</li></ul>"],
["👤","Your name","<p>The first time you open the app it asks what to call you. Your name appears in the Home greeting, the Study Hub card in Settings and your share cards. You can change it any time in Settings → <b>Profile → Your name</b>. If you skip it, the app says \"Student\".</p>"],
["🛟","If something goes wrong","<p>If the app hits an unexpected error it shows a <b>Something went wrong</b> screen instead of a blank page. Your data stays on the device. <b>Export backup</b> saves a copy first, <b>Reload</b> tries again, and <b>Restore previous data</b> (when available) returns to the state before your last import, reset or delete. <b>Details</b> shows the error text if you need to report it.</p>"],
["🔐","Privacy, terms and your data","<p>Settings → Help has the <b>Privacy Policy</b> and <b>Terms of Use</b>. In short: your data stays on your device; there are no ads, analytics or tracking; Google Firebase is used only if you sign in for cloud sync; share cards and emails go only where you send them; and the app is not affiliated with NTA, JEE or any coaching institute.</p>"],
["♿","Accessibility","<ul><li>Icon-only buttons have spoken labels for screen readers, and switches announce on or off.</li><li>The bottom bar is marked as navigation and announces the current tab.</li><li>Small buttons get a bigger touch area, at least 44 px.</li><li>Keyboard users get a clear outline when a control is focused, and Enter or Space activates it.</li><li>Motion Effects can be turned off, and the app also follows your phone's reduce-motion setting.</li><li>Minimalist mode gives maximum contrast: pure black with white text.</li></ul>"]
];
function helpScreen(){return `<section class="screen">${header('Help','Everything about the app','back')}<div class="card hpSearch"><input id="hpSearch" type="search" placeholder="Search help" autocomplete="off"></div>${HELP_SECS.map(x=>`<details class="card hpSec"><summary><span class="hpIc">${x[0]}</span><b>${x[1]}</b><i>›</i></summary><div class="hpBody">${x[2]}</div></details>`).join('')}<div class="hpNone" id="hpNone" style="display:none">No help topic matches that.</div></section>`}
document.addEventListener('input',function(e){if(!e.target||e.target.id!=='hpSearch')return;var q=e.target.value.trim().toLowerCase(),n=0;document.querySelectorAll('.hpSec').forEach(function(d){var hit=!q||d.textContent.toLowerCase().includes(q);d.style.display=hit?'':'none';d.open=!!q&&hit;if(hit)n++});var z=document.getElementById('hpNone');if(z)z.style.display=n?'none':''});

 document.body.appendChild(o);setTimeout(()=>{const i=document.getElementById('nameInput');if(i)i.focus()},60)

 if(!data.settings)data.settings={...seed.settings};

}

const REC_ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',LEGAL_CONTACT='[add your contact email here]';
function recGen(){const a=new Uint32Array(8);(window.crypto||window.msCrypto).getRandomValues(a);let c='';for(let i=0;i<8;i++)c+=REC_ALPHA[a[i]%REC_ALPHA.length];return c.slice(0,4)+'-'+c.slice(4)}
function recNorm(c){return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function recHashOf(c){return sha256('jee-tracker-recovery:'+recNorm(c))}
function recClose(){document.querySelectorAll('.recOv').forEach(e=>e.remove())}
function recShow(code){recClose();const o=document.createElement('div');o.className='recOv';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-label','Recovery code');
 o.innerHTML='<div class="recCard"><b>Your recovery code</b><div class="recCode" aria-label="Recovery code">'+esc(code)+'</div><span>Write this down or save it somewhere safe. If you forget your PIN, tap <b>Forgot PIN?</b> on the lock screen and enter this code to turn App Lock off. It is shown only once.</span><div class="recBtns"><button class="recAlt" data-action="rec-copy" data-code="'+esc(code)+'">Copy</button><button class="recMain" data-action="rec-done">I\'ve saved it</button></div></div>';document.body.appendChild(o)}
function recForgot(){recClose();const has=!!(data.settings&&data.settings.recHash),w=pinWaitLeft();const o=document.createElement('div');o.className='recOv';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-label','Forgot PIN');
 o.innerHTML='<div class="recCard"><b>Forgot your PIN?</b>'+(has?'<span>Enter the recovery code you saved when you set your PIN. App Lock will turn off and you can set a new PIN in Settings.</span><input id="recInput" type="text" maxlength="9" autocapitalize="characters" autocomplete="off" placeholder="XXXX-XXXX"><div class="recMsg" id="recMsg">'+(w?'Too many attempts · try again in '+Math.ceil(w/1000)+'s':'')+'</div><div class="recBtns"><button class="recAlt" data-action="rec-cancel">Cancel</button><button class="recMain" data-action="rec-submit">Reset</button></div>':'<span>No recovery code was created for this PIN, so it cannot be reset from here.</span><div class="recBtns"><button class="recAlt" data-action="rec-cancel">Cancel</button></div>')+'<button class="recDanger" data-action="rec-erase">Erase app data and start over</button></div>';document.body.appendChild(o);setTimeout(()=>{const i=document.getElementById('recInput');if(i)i.focus()},60)}
function recSubmit(){const i=document.getElementById('recInput'),m=document.getElementById('recMsg');if(!i)return;const left=pinWaitLeft();if(left>0){if(m)m.textContent='Too many attempts · try again in '+Math.ceil(left/1000)+'s';return}
 if(recHashOf(i.value)===data.settings.recHash){pinSet('jee-pin-fails',0);pinSet('jee-pin-until',0);data.settings.appLock=false;delete data.settings.pinHash;delete data.settings.recHash;save();state.locked=false;recClose();render();toast('App Lock turned off · set a new PIN in Settings');return}
 let f=pinGet('jee-pin-fails')+1;if(f>=PIN_MAX){pinSet('jee-pin-fails',0);pinSet('jee-pin-until',Date.now()+PIN_WAIT);if(m)m.textContent='Too many attempts · try again in '+Math.ceil(PIN_WAIT/1000)+'s'}else{pinSet('jee-pin-fails',f);if(m)m.textContent='That code is not right · '+(PIN_MAX-f)+' attempt'+(PIN_MAX-f===1?'':'s')+' left'}}
let fatalShown=false;
function showFatal(e){if(fatalShown)return;fatalShown=true;const hasPrev=!!(function(){try{return localStorage.getItem(KEY+'-prev')}catch(_){return null}})();const msg=String((e&&e.message)||e||'Unknown error').slice(0,300);
 const o=document.createElement('div');o.className='fatalOv';o.setAttribute('role','alertdialog');o.setAttribute('aria-modal','true');
 o.innerHTML='<div class="fatalCard"><b>Something went wrong</b><span>Your data is safe on this device. Reload to try again. If it keeps happening, export a backup first.</span><div class="recBtns"><button class="recAlt" data-action="fatal-export">Export backup</button><button class="recMain" data-action="fatal-reload">Reload</button></div>'+(hasPrev?'<button class="recDanger" data-action="fatal-restore">Restore previous data</button>':'')+'<details><summary>Details</summary><code>'+esc(msg)+'</code></details></div>';document.body.appendChild(o)}
window.addEventListener('error',function(ev){if(!ev||!ev.error)return;if(/ResizeObserver/.test(String(ev.message||'')))return;try{showFatal(ev.error)}catch(_){}});
const A11Y_LABELS={back:'Back','sh-close':'Close','name-skip':'Skip','pin-cancel':'Cancel','myday-del':'Delete target','myday-target':'Edit target','td-del':'Delete checklist item','pd-dismiss':'Dismiss','nav':'Navigate'};
function a11yPass(){
 const nav=document.querySelector('.bottom');if(nav){nav.setAttribute('role','navigation');nav.setAttribute('aria-label','Main navigation');nav.querySelectorAll('.navBtn').forEach(b=>{if(b.classList.contains('active'))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}

function myDayData(){if(!data.myDay||!Array.isArray(data.myDay.items))data.myDay={day:'',items:[],pastDue:[]};if(!Array.isArray(data.myDay.pastDue))data.myDay.pastDue=[];if(!Array.isArray(data.myDay.todos))data.myDay.todos=[];if(!data.myDay.rem)data.myDay.rem={on:false,time:'20:00',shown:''};const t=todayKey();if(data.myDay.day!==t){const prev=data.myDay.day;if(prev&&t<prev){data.myDay.day=t;save();return data.myDay}if(prev){try{const sn=buildShareText(new Date(prev+'T12:00:00'),data.myDay);if(sn[1])data.myDay.last={day:prev,text:sn[0]}}catch(_){}try{const hv=mdExtraDone(prev,data.myDay);if(hv>0){const hh=data.myDay.hist&&typeof data.myDay.hist==='object'?data.myDay.hist:(data.myDay.hist={});hh[prev]=hv;Object.keys(hh).sort().slice(0,-90).forEach(k=>delete hh[k])}}catch(_){}const pdw=new Date(prev+'T00:00:00').getDay();const keep=new Set();data.myDay.items.forEach(i=>{const tg=Number(i.target)||0,dn=Number(i.done)||0;if(!mdRec(i)){if(dn<tg){i.target=tg-dn;keep.add(i)}return}if(!mdOn(i,pdw))return;if(dn<tg){const left=tg-dn,ex=data.myDay.pastDue.find(p=>p.title===i.title);if(ex){ex.left=Math.min(Number(ex.left)||left,left);ex.target=ex.left;ex.done=0;ex.from=prev}else data.myDay.pastDue.push({id:pdId(),title:i.title,left:left,from:prev,target:left,done:0})}});data.myDay.pastDue=data.myDay.pastDue.slice(-40);data.myDay.items=data.myDay.items.filter(i=>mdRec(i)||keep.has(i))}data.myDay.items.forEach(i=>{if(i.base!=null){i.target=i.base;delete i.base}i.done=0;delete i.banked});data.myDay.tdCleared=0;data.myDay.tdClrNames=[];data.myDay.day=t;save()}return data.myDay}
function mdKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

<script>
/* ===== Phone back button: step back inside the app instead of closing it ===== */
(function(){
 if(!window.history||!history.pushState)return;
 var armed=false,leaving=false;
 function arm(){if(armed)return;armed=true;try{history.pushState({jeeGuard:1},'')}catch(_){armed=false}}
 /* Chrome ignores history entries added before the first tap, so arm on the first touch/click */
 ['pointerdown','touchstart','click','keydown'].forEach(function(t){window.addEventListener(t,arm,{once:true,capture:true,passive:true})});
 function overlayBack(){
  var e;
  try{
   if(document.querySelector('.cardOverlay')){repCardHide();return true}
   if(document.querySelector('.shOv')){shHide();return true}
   if(document.querySelector('.repSheet')){repHide();return true}
   if((e=document.querySelector('.nameOv [data-action=name-skip]'))){e.click();return true}
   if(document.querySelector('.nameOv')){nameClose();return true}
   if((e=document.querySelector('.pinOverlay [data-action=pin-cancel]'))){e.click();return true}
   if((e=document.querySelector('.recOv [data-action=rec-cancel]'))){e.click();return true}
   if(document.querySelector('.recOv')){recClose();return true}
  }catch(_){}
  return false;
 }
 function goBack(){
  var t=document.createElement('button');t.setAttribute('data-action','back');t.style.display='none';
  document.body.appendChild(t);try{t.click()}finally{t.remove()}
 }
 window.addEventListener('popstate',function(){
  if(leaving||!armed)return;
  /* the guard entry was just used up, so put it back before doing anything else */
  var atRoot=false;
  if(overlayBack()){}
  else if(state.screen==='home'||state.screen==='splash'||state.locked)atRoot=true;
  else goBack();
  if(atRoot){leaving=true;armed=false;history.back();return}
  try{history.pushState({jeeGuard:1},'')}catch(_){armed=false}
 });
})();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', {scope:'./'}).then(reg => reg && reg.update().catch(() => {})).catch(() => {})); }
</script>
